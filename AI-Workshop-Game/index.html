<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Beat the AI! Workshop Game</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(130deg,#e9e4ff,#d9fbf0,#ffe7f2);font-family:system-ui,Arial;color:#20234d;padding:20px}.box{background:white;border-radius:28px;max-width:760px;width:100%;padding:clamp(22px,5vw,45px);box-shadow:0 20px 70px #48418033}h1{font-size:clamp(32px,7vw,55px);margin:5px 0;color:#5940ba}.tag{display:inline-block;border-radius:30px;background:#eeeaff;padding:9px 17px;font-weight:700}.robot{font-size:65px;text-align:center}.center{text-align:center}p{line-height:1.5}.btn{display:block;width:100%;padding:17px;border:0;border-radius:16px;margin:11px 0;font-size:17px;font-weight:700;background:#f2f0ff;color:#262451;cursor:pointer;text-align:left}.btn:hover{background:#dfd8ff}.primary{background:#6751d6;color:white;text-align:center}.primary:hover{background:#5140b6}.correct{background:#d2f8df!important;color:#146035}.wrong{background:#ffe0e5!important;color:#9a2638}.bar{height:12px;background:#eceafa;border-radius:20px;overflow:hidden;margin:20px 0}.fill{height:100%;background:#6b58db;transition:width .3s}.row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.feedback{padding:14px;border-radius:14px;background:#f6f4ff;margin:15px 0;font-weight:650}.small{color:#656789}#next{margin-top:15px}</style></head><body><main class="box"><div class="row"><span class="tag">🎓 AI Workshop Challenge</span><span class="tag" id="score">⭐ 0 points</span></div><div id="content"></div></main><script>const q=[{t:"Which task can AI help teachers complete?",a:["Create differentiated lesson activities","Replace teachers completely","Guarantee full marks","Read students' minds"],c:0,e:"AI helps teachers prepare resources and adapt learning."},{t:"What is the best way to use an AI-generated lesson?",a:["Teach it without checking","Review, adapt and improve it","Assume all facts are correct","Share private student data"],c:1,e:"Teacher judgment is essential: always review AI output."},{t:"Which prompt is most useful?",a:["Make something","Help me","Create a 5-minute Grade 6 vocabulary starter with 3 questions","Do my job"],c:2,e:"Specific prompts give more useful results."},{t:"AI can support differentiation by…",a:["Giving every learner identical tasks","Creating activities at varied challenge levels","Removing teacher feedback","Avoiding student assessment"],c:1,e:"AI can help tailor tasks to learners' needs."},{t:"What is the teacher's superpower when using AI?",a:["Trusting every answer","Never checking sources","Combining AI efficiency with human creativity and care","Letting AI decide everything"],c:2,e:"Teachers bring expertise, relationships and professional judgment."}];let i=-1,points=0,selected=false;const el=document.getElementById('content'),score=document.getElementById('score');function intro(){el.innerHTML='<div class="center"><div class="robot">🤖🎮</div><h1>BEAT THE AI!</h1><h2>Can your team score 100?</h2><p>Five quick questions about using AI in education. Earn 20 points for each correct answer!</p><button class="btn primary" onclick="start()">🚀 Start Game</button><p class="small">Perfect for playing together at an AI workshop.</p></div>'}function start(){i=0;points=0;show()}function show(){selected=false;score.textContent='⭐ '+points+' points';let x=q[i];el.innerHTML='<p class="small">Question '+(i+1)+' of '+q.length+'</p><div class="bar"><div class="fill" style="width:'+((i+1)/q.length*100)+'%"></div></div><h2>'+x.t+'</h2><div id="answers"></div><div id="feedback" aria-live="polite"></div><div id="next"></div>';x.a.forEach((a,n)=>{let b=document.createElement('button');b.className='btn';b.textContent=String.fromCharCode(65+n)+'. '+a;b.onclick=()=>answer(n);document.getElementById('answers').append(b)})}function answer(n){if(selected)return;selected=true;let x=q[i],buttons=document.querySelectorAll('#answers button');buttons.forEach((b,k)=>{b.disabled=true;if(k===x.c)b.classList.add('correct');if(k===n&&n!==x.c)b.classList.add('wrong')});if(n===x.c)points+=20;score.textContent='⭐ '+points+' points';document.getElementById('feedback').innerHTML='<div class="feedback">'+(n===x.c?'🎉 Correct! +20 points':'💡 Good try!')+' '+x.e+'</div>';document.getElementById('next').innerHTML='<button class="btn primary" onclick="advance()">'+(i===q.length-1?'🏆 See My Score':'➡️ Next Question')+'</button>'}function advance(){i++;if(i<q.length)show();else finish()}function finish(){el.innerHTML='<div class="center"><div class="robot">'+(points===100?'🏆':'🎉')+'</div><h1>Challenge Complete!</h1><h2>'+points+' / 100 points</h2><p>'+(points===100?'AI Champion! Outstanding work!':points>=60?'Great job! Keep exploring AI tools.':'Every AI expert starts by experimenting!')+'</p><button class="btn primary" onclick="start()">🔄 Play Again</button></div>'}intro();</script></body></html>
