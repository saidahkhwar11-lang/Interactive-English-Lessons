<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lesson Plan · Al Reyadah School</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f8fa;font-family:Arial,sans-serif;color:#173f67}.wrap{width:min(1000px,94vw);margin:28px auto}.head{background:linear-gradient(110deg,#e9f8ef,#e5f6ff 58%,#fff3cb);border-radius:24px;padding:24px;display:flex;gap:16px;align-items:center}.logo{font-size:40px}.head h1{margin:0;color:#123e66}.head p{margin:5px 0 0;color:#5d7789}.card{background:#fff;border:1px solid #dce9ee;border-radius:20px;padding:20px;margin-top:14px}.meta{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.meta div{background:#f8fbfd;border-radius:13px;padding:11px}.meta small{display:block;color:#718797;font-weight:800;margin-bottom:3px}.section h2{color:#174f72;font-size:19px;margin:0 0 10px}.pre{white-space:pre-wrap;line-height:1.6}.flow{width:100%;border-collapse:collapse;font-size:13px}.flow th,.flow td{border:1px solid #d8e5ea;padding:9px;text-align:left;vertical-align:top}.flow th{background:#eef7fa}.activity{border:1px solid #d8e7ed;border-radius:18px;margin:12px 0;padding:16px;background:#fff}.activityHead{display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid #e4edf1;padding-bottom:10px}.activityHead h3{margin:5px 0 0;color:#174f72}.step{font-size:10px;font-weight:900;color:#8a6b20;background:#fff0b8;padding:5px 8px;border-radius:999px}.activityMeta{font-size:12px;font-weight:850;color:#5d7789}.objective{margin:12px 0;padding:10px;border-radius:12px;background:#eef8fc}.objective b{color:#126a8e}.activityGrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.activityGrid>div{background:#f9fbfc;border-radius:12px;padding:11px}.activityGrid b{color:#315f79}.activityGrid p{margin:5px 0 0;line-height:1.5}.activityGrid .wide{grid-column:1/-1}.privacy{text-align:center;color:#78909e;font-size:11px;margin:18px}.bad{padding:30px;text-align:center}@media(max-width:700px){.meta{grid-template-columns:1fr 1fr}.flow{font-size:11px}}</style></head><body><main class="wrap" id="app"><div class="bad">Loading lesson plan…</div></main><script>
function dec(v){try{v=v.replace(/-/g,'+').replace(/_/g,'/');while(v.length%4)v+='=';return JSON.parse(decodeURIComponent(escape(atob(v))))}catch(e){return null}}
function esc(v){return String(v||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
const d=dec(location.hash.slice(1)),app=document.getElementById('app');
if(!d){app.innerHTML='<div class="card bad"><h2>Lesson plan unavailable</h2><p>This QR does not contain a valid lesson plan.</p></div>'}
else{let rows=(d.flow||[]).map((x,i)=>'<section class="activity"><div class="activityHead"><div><span class="step">Step '+(i+1)+'</span><h3>'+esc(x.stage)+'</h3></div><div class="activityMeta">⏱ '+esc(x.time)+' min &nbsp; · &nbsp; 📖 Page '+esc(x.page||'—')+'</div></div><div class="objective"><b>🎯 Activity Objective</b><div>'+esc(x.objective)+'</div></div><div class="activityGrid"><div><b>📌 Activity / Instructions</b><p>'+esc(x.activity||x.students)+'</p></div><div><b>👩‍🏫 Teacher Actions</b><p>'+esc(x.teacher)+'</p></div><div><b>👩‍🎓 Student Actions</b><p>'+esc(x.students)+'</p></div><div><b>✓ Assessment / Check</b><p>'+esc(x.assessment)+'</p></div><div class="wide"><b>🌱 Support & Challenge</b><p>'+esc(x.support)+'</p></div></div></section>').join('');
app.innerHTML='<section class="head"><div class="logo">📋</div><div><h1>'+esc(d.school||'Al Reyadah School')+'</h1><p>Visitor Lesson Plan · Read Only</p></div></section><section class="card meta"><div><small>Teacher</small>'+esc(d.teacher)+'</div><div><small>Grade</small>'+esc(d.grade)+'</div><div><small>Date / Day</small>'+esc(d.date||'—')+'</div><div><small>Lesson</small>'+esc(d.title)+'</div></section><section class="card section"><h2>Learning Objectives</h2><div class="pre">'+esc(d.objectives)+'</div></section><section class="card section"><h2>Success Criteria</h2><div class="pre">'+esc(d.success)+'</div></section><section class="card section"><h2>Key Vocabulary / Language</h2><div class="pre">'+esc(d.vocab)+'</div></section><section class="card section"><h2>Resources</h2><div class="pre">'+esc(d.resources)+'</div></section><section class="card section"><h2>Lesson Flow</h2><div style="overflow:auto"><table class="flow"><tr><th>Stage</th><th>Time</th><th>Page</th><th>Student Activity</th><th>Objective</th></tr>'+rows+'</table></div></section><section class="card section"><h2>Differentiation</h2><div class="pre">'+esc(d.differentiation)+'</div></section><section class="card section"><h2>Assessment & Follow-up</h2><div class="pre">'+esc(d.assessment)+'</div></section><div class="privacy">Lesson plan visitor view · No access to Lesson Studio, lesson library, attendance or editing controls.</div>'}
</script></body></html>
