<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teacher Lesson Library</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f8fa;color:#173f67}.head{padding:24px;background:linear-gradient(105deg,#eaf9ef,#e5f7ff 58%,#fff4cc);text-align:center}.head h1{margin:0}.wrap{width:min(1100px,94vw);margin:22px auto}.filters{display:flex;gap:8px;justify-content:center;margin-bottom:18px}.filters button{border:0;border-radius:999px;padding:9px 15px;font-weight:900;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.card{background:#fff;border:1px solid #dbe8ee;border-radius:20px;padding:18px}.card h3{margin:0 0 7px}.card p{color:#6b8291}.card button{border:0;border-radius:11px;padding:9px 12px;font-weight:900;cursor:pointer;background:#d46b3c;color:#fff;margin-right:6px}.empty{text-align:center;padding:45px;color:#718998}</style></head><body><header class="head"><div style="font-size:36px">👩‍🏫</div><h1>Teacher Lesson Library</h1><p>Presentation access only · Al Reyadah School</p></header><main class="wrap"><div class="filters"><button onclick="show('all')">All</button><button onclick="show('6')">Grade 6</button><button onclick="show('9')">Grade 9</button></div><div class="grid" id="grid"><div class="empty">Shared lessons will appear here after the admin marks them Visitor ON.</div></div></main><script>
/* Visitor library intentionally has no access to the creator's browser IndexedDB.
   Published visitor lessons will be listed here from the public lesson catalog. */
const API='https://hobfifobduqslvnagwlb.supabase.co',KEY='sb_publishable_fbK9aPfpg1rgqy32fPR59A_uxp-kygF';let items=[];
function show(g){let a=g==='all'?items:items.filter(x=>String(x.grade).includes(g)),el=document.getElementById('grid');el.innerHTML=a.length?a.map(x=>'<div class="card"><h3>'+esc(x.title)+'</h3><p>'+esc(x.grade||'')+'</p><button onclick="openLesson(\''+esc(x.id)+'\')">▶ Present Lesson</button><button onclick="openPlan(\''+esc(x.id)+'\')" style="background:#4f8b72">📋 Lesson Plan</button></div>').join(''):'<div class="empty">No shared lessons in this grade yet.</div>'}
function esc(v){return String(v||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function openLesson(id){location.href='share.html?id='+encodeURIComponent(id)}function openPlan(id){window.open('visitor.html?id='+encodeURIComponent(id),'_blank')}
async function load(){try{let r=await fetch(API+'/rest/v1/shared_lesson_payloads?select=id,payload,updated_at&order=updated_at.desc',{headers:{apikey:KEY,Authorization:'Bearer '+KEY}});if(!r.ok)throw 0;let rows=await r.json();items=rows.map(x=>({id:x.id,title:x.payload?.slides?.[0]?.lesson||'Lesson',grade:'Grade '+(x.payload?.grade||'')}));show('all')}catch(e){}}load();</script></body></html>
