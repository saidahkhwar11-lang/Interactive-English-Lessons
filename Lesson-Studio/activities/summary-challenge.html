body{background:linear-gradient(145deg,#edf6fa,#f3f1fc 70%,#f7f9fc)}

.recipe-stage{position:relative;isolation:isolate;overflow:hidden;background:radial-gradient(circle at 88% 10%,#e99dff44,transparent 28%),radial-gradient(circle at 12% 88%,#4ddde344,transparent 29%),linear-gradient(125deg,#112d60,#37458f 54%,#6b439e);border:1px solid #ffffff44;box-shadow:0 22px 55px #293e7840,inset 0 1px #ffffff55;padding:36px;border-radius:29px}

const para='Many people have old CDs and books at home that they no longer use. Most people don’t want to throw them away, so they sit there year after year and nobody uses them. That’s where the idea of swapping comes in – giving someone one thing and getting another thing from them. There are now many websites where you can swap almost anything, not only those CDs you don’t want, but also clothes, toys, and furniture. No money changes hands, so no one makes a profit.';
function annotate(){let p=para;if(part>=1&&part<=3){p=p.replace('swapping',`<span class="target">swapping${part===3?'<span class="bubble">↖ trading one thing for another</span>':''}</span>`);if(part>=2)p=p.replace('giving someone one thing and getting another thing from them','<span class="context">giving someone one thing and getting another thing from them</span>')}if(part>=4&&part<=6){p=p.replace('profit.','<span class="target blue">profit'+(part===6?'<span class="bubble blue">↖ money earned or gained</span>':'')+'</span>.');if(part>=5)p=p.replace('No money changes hands','<span class="context blue">No money changes hands</span>')}if(part>=8)p=p.replace('That’s where the idea of swapping comes in – giving someone one thing and getting another thing from them.','<span class="mainidea">That’s where the idea of swapping comes in – giving someone one thing and getting another thing from them.</span>');if(part>=9)p=p.replace('There are now many websites where you can swap almost anything, not only those CDs you don’t want, but also clothes, toys, and furniture.','<span class="support">There are now many websites where you can swap almost anything, not only those CDs you don’t want, but also clothes, toys, and furniture.</span>');if(part>=10)p=p.replace('No money changes hands, so nobody makes a profit.','<span class="support">No money changes hands, so nobody makes a profit.</span>');return p}
const segments=[['The paragraph explains that ','starter'],['people can trade items they no longer need','idea'],[' using online websites. ','detail'],['They can exchange things such as books, toys and clothes','detail'],[' without using money.','detail']];

['🔍','DISCOVER','What do the new words mean?','Look for context clues.'],
['💡','MAIN IDEA','What is it mostly about?','Keep the central message.'],
['🖍️','DETAILS','Which facts really matter?','Choose only key details.'],
['✍️','WRITE','How can I say it in my own words?','Use a starter + main idea + details.']
];
h=`<div class="eyebrow">01 / THE SUMMARY CHALLENGE</div><h1>Can you turn a long paragraph into a short summary?</h1><p class="sub">Watch the five steps appear. Then try them on Paragraph A!</p>
<div class="recipe-stage"><div class="recipe-orbit orbit-one">✦</div><div class="recipe-orbit orbit-two">✧</div><div class="recipe-header"><span class="recipe-spark">✦</span><div><div class="recipe-mini">OUR SECRET RECIPE</div><div class="recipe-headline">5 steps for a great summary</div></div><span class="recipe-count">${Math.min(introStep,5)} / 5</span></div>
<div class="recipe-track">${steps.map(([icon,name,q,tip],i)=>`<div class="recipe-step ${i<introStep?'unlocked':''} ${i===introStep-1?'current':''}"><div class="recipe-symbol">${i<introStep?icon:'✦'}</div><div class="recipe-name">${i<introStep?name:'COMING UP'}</div>${i<introStep?`<div class="recipe-tip">${tip}</div>`:''}</div>`).join('')}</div>
<div class="recipe-message">${introStep===0?'Ready? Reveal the first step.':introStep<5?`<span class="recipe-question">${steps[introStep-1][2]}</span>`:'<strong>Now we are ready to practise on Paragraph A!</strong>'}</div></div>
<div class="recipe-starters"><div class="starter-heading"><span class="starter-pencil">✍️</span><div><strong>Sentence starter toolbox</strong><small>Choose one to begin your summary</small></div></div><div class="phrases">${['The paragraph explains that…','The text is about…','The main idea is…','It also mentions…','Overall,…'].map(x=>`<span>${x}</span>`).join('')}</div></div>`;
}
if(screen===1){
const writingMode=part>=11;
const writingCount=Math.max(0,part-11);
const currentStep=part===0?1:part<=6?2:part<=8?3:part<=10?4:5;
const stepLabels=['Read','New Words','Main Idea','Key Details','Write'];
const stepBadge='<aside class="model-step-badge" aria-label="Five summarizing steps"><div class="model-badge-title">✦ 5 Steps to Summarize</div><div class="model-badge-steps">'+stepLabels.map((label,i)=>'<div class="model-badge-item '+(i+1===currentStep?'active':'')+' '+(i+1<currentStep?'completed':'')+'"><span class="model-step-number">'+(i+1<currentStep?'✓':i+1)+'</span><span>'+label+'</span></div>').join('')+'</div></aside>';

h=`<div class="model-header"><div><div class="eyebrow">01 / Guided modelling</div><h1>Read, discover & summarize</h1></div>${stepBadge}</div><p class="sub">${writingMode?'Now use the same paragraph to write a summary in your own words.':'Read Paragraph A, discover vocabulary, then identify the main idea and supporting details.'}</p>
${writingMode?`<div class="phrases">${['The paragraph explains that…','The text is about…','The main idea is…','It also mentions…','Overall,…'].map(x=>`<span>${x}</span>`).join('')}</div>`:''}
${!writingMode&&part===7?`<div class="discussion"><div class="discussion-icon">💭</div><div class="discussion-content"><div class="discussion-label">THINK · PAIR · SHARE</div><h2>What is the paragraph mostly about?</h2><p>Which important details support this idea?</p></div><div class="discussion-pause">Discuss first<br><strong>Then reveal →</strong></div></div>`:''}
<div class="writing ${writingMode?'':'reading-first'}">
${writingMode?`<div><div class="sectionlabel">✍️ Model summary</div><div class="paper">${segments.slice(0,writingCount).map(([t,c])=>`<span class="${c}">${t}</span>`).join('')}${writingCount<segments.length?'▏':''}</div><div class="key"><span style="background:#eee5ff">Purple — starter</span><span>Pink — main idea</span><span>Blue — details</span></div></div>`:''}
<div class="source"><div class="sectionlabel">📖 Paragraph A</div><div class="source-paragraph">${writingMode?annotateFinal():annotate()}</div></div></div>
${!writingMode?`<div class="key">${part>=8?'<span>Pink — main idea</span><span>Blue — supporting details</span>':''}</div><p class="hint">${part===0?'Read together first.':part===1||part===4?'Pause: students suggest the meaning.':part===2||part===5?'Students find the clue in the text.':part===3||part===6?'Discuss the meaning using the clue.':part===7?'Give students time to answer before revealing.':part>=8?'Look for the main idea and supporting details.':'Click Reveal when ready.'}</p>`:'<p class="hint">Reveal the summary phrase by phrase. The paragraph stays visible for comparison.</p>'}`;
}
if(screen===2){h=`<div class="eyebrow">03 / Independent practice</div><h1>Your turn! <span style="color:#168e83">10 minutes</span></h1><div class="instruction">In your notebook, read <b>Paragraphs B and C</b>. Highlight the new words, find context clues, underline the main idea and supporting details, then write a <b>2–4 sentence summary for each paragraph</b> using your own words.</div><div class="phrases">${['The paragraph explains that…','The text is about…','The main idea is…','It also mentions…','Overall,…'].map(x=>`<span>${x}</span>`).join('')}</div><div class="practicegrid"><div class="practicebox"><div class="sectionlabel">Paragraph B</div><img src="${BIMG}" alt="Textbook Paragraph B"><div class="chips">Highlight: <mark>goods</mark> and <mark>secondhand goods</mark></div></div><div class="practicebox"><div class="sectionlabel">Paragraph C</div><img src="${CIMG}" alt="Textbook Paragraph C"><div class="chips">Highlight: <mark>technologies</mark> and <mark>rent</mark></div></div></div><div class="bottomtimer"><span class="timer" id="clock">10:00</span><button class="dark" onclick="toggleTimer(event)">▶ Start / Pause</button><button class="light" onclick="resetTimer(event)">↺ Reset</button></div>`}
document.getElementById('slide').innerHTML=h;
document.getElementById('dots').innerHTML=[0,1,2].map(i=>`<i class="${i===screen?'on':''}"></i>`).join('');
document.getElementById('nextBtn').textContent=screen===2?'Finish ✓':screen===0?(introStep<5?'Reveal next step →':'Apply to Paragraph A →'):part===16?'Your turn →':part===10?'Show summary notebook →':'Reveal →';
document.getElementById('nextBtn').disabled=screen===2;clock();
}
function annotateFinal(){let p=para;p=p.replace('That’s where the idea of swapping comes in – giving someone one thing and getting another thing from them.','<span class="mainidea">That’s where the idea of swapping comes in – giving someone one thing and getting another thing from them.</span>');p=p.replace('There are now many websites where you can swap almost anything, not only those CDs you don’t want, but also clothes, toys, and furniture.','<span class="support">There are now many websites where you can swap almost anything, not only those CDs you don’t want, but also clothes, toys, and furniture.</span>');p=p.replace('No money changes hands, so no one makes a profit.','<span class="support">No money changes hands, so no one makes a profit.</span>');return p}
function next(){if(screen===0){if(introStep<5)introStep++;else{screen=1;part=0}}else if(screen===1&&part<16)part++;else if(screen===1){screen=2;part=0}render()}
function back(){if(screen===2){screen=1;part=16}else if(screen===1&&part>0)part--;else if(screen===1){screen=0;introStep=5;part=0}else if(screen===0&&introStep>0)introStep--;render()}
function advance(e){if(e.target.closest('button,a'))return;if(screen!==2)next()}
function reset(){screen=0;part=0;clearInterval(interval);interval=null;sec=600;render()}
function fullscreen(){if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.()}
function clock(){let x=document.getElementById('clock');if(x)x.textContent=`${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`}
function toggleTimer(e){e.stopPropagation();if(interval){clearInterval(interval);interval=null;return}interval=setInterval(()=>{sec=Math.max(0,sec-1);clock();if(!sec){clearInterval(interval);interval=null;alert('Time is up!')}},1000)}
function resetTimer(e){e.stopPropagation();clearInterval(interval);interval=null;sec=600;clock()}
render();
</script></body></html>
