<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shared Lesson · Al Reyadah School</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f9fb;color:#123e66}.app{min-height:100vh;display:grid;grid-template-columns:245px 1fr}.nav{background:#f7fbfe;border-right:1px solid #dbe9ef;padding:18px;overflow:auto}.brand{font-size:22px;font-weight:950;margin-bottom:16px}.nav button{width:100%;border:1px solid #d9e8ef;border-radius:15px;background:#fff;padding:12px;text-align:left;color:#123e66;cursor:pointer;font-weight:850;margin-bottom:8px}.nav button small{display:block;margin-top:4px;color:#688297}.nav button.active{background:#eaf9f0;border-color:#9fd7b4;box-shadow:inset 5px 0 #4fbd82}.main{min-width:0}.top{min-height:82px;padding:12px 20px;background:linear-gradient(105deg,#eaf9ef,#e5f7ff 58%,#fff4cc);display:flex;align-items:center;gap:14px;border-bottom:1px solid #dbe9ef}.top h1{margin:0;font-size:27px;color:#3b2a20}.top p{margin:3px 0 0;color:#59768e}.actions{margin-left:auto;display:flex;align-items:center;gap:8px}.actions button{border:0;border-radius:12px;padding:9px 12px;font-weight:900;cursor:pointer}.qr{background:#fff;padding:5px;border-radius:12px;width:68px;height:68px;cursor:pointer}.slide{padding:22px;display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:18px;min-height:calc(100vh - 82px)}.visual{background:#fff;border-radius:25px;padding:18px;display:flex;align-items:center;justify-content:center;min-width:0;box-shadow:0 8px 24px rgba(25,68,91,.07);position:relative;overflow:hidden}.visual img{max-width:100%;max-height:76vh;object-fit:contain;border-radius:18px;cursor:zoom-in}.details{border:1px solid #efd78a;border-radius:25px;padding:22px;background:linear-gradient(160deg,#fff7d8,#fffdf7)}.details h2{font-size:29px;color:#a55216}.mission{font-size:18px;line-height:1.5;font-weight:700}.badge{display:inline-block;background:#fff;border:1px solid #dce8ed;border-radius:12px;padding:8px 10px;font-weight:850;margin:5px}.timer{text-align:center;margin-top:16px;padding:12px;border-radius:16px;background:#e8f8ff}.clock{font-size:42px;font-weight:950}.timer button,.reveal{border:0;border-radius:10px;padding:8px 10px;font-weight:900;margin:4px;cursor:pointer}.gallery{width:100%;height:100%;display:grid;gap:12px}.gallery.multi{grid-template-columns:repeat(2,minmax(0,1fr))}.card{min-width:0;position:relative;display:flex;align-items:center;justify-content:center}.card img{width:100%;height:100%;object-fit:contain}.answers{position:absolute;left:14px;bottom:14px;display:flex;gap:6px}.questionLayer{position:absolute;left:12px;top:12px;display:grid;gap:7px}.questionLayer button{width:38px;height:38px;border:0;border-radius:50%;background:#173f67;color:#fff;font-weight:900;cursor:pointer}.qcard{position:absolute;left:62px;top:12px;max-width:430px;background:#fff;border:2px solid #8ec9df;border-radius:16px;padding:14px;z-index:5;box-shadow:0 10px 25px #1234}.reading{width:100%;display:grid;grid-template-columns:minmax(0,1fr) 245px;gap:20px}.poster{background:#fff;border-radius:20px;display:flex;align-items:center;justify-content:center;min-height:65vh}.poster img{max-width:100%;max-height:72vh;object-fit:contain}.tools{display:grid;gap:10px}.panel{background:#fff;border:1px solid #d8e7ed;border-radius:16px;padding:12px}.zoom{position:fixed;inset:0;background:#092131dd;display:none;z-index:20;align-items:center;justify-content:center;padding:25px}.zoom.open{display:flex}.zoom img{max-width:94vw;max-height:90vh}.close{position:absolute;right:3vw;top:3vh;border:0;border-radius:50%;width:45px;height:45px;font-size:22px}.bad{padding:40px;text-align:center}.audio{margin-top:14px}.audio audio{width:100%}@media(max-width:900px){.app{grid-template-columns:190px 1fr}.slide{grid-template-columns:1fr}.reading{grid-template-columns:1fr}}
</style></head><body><div id="root" class="bad">Loading shared lesson…</div><div class="zoom" id="zoom"><button class="close" id="zclose">×</button><img id="zimg"></div>
<script>
const API='https://hobfifobduqslvnagwlb.supabase.co',KEY='sb_publishable_fbK9aPfpg1rgqy32fPR59A_uxp-kygF';let lesson=null,slides=[],idx=0,timer=null,remain=300;
const esc=v=>String(v||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const planLink=id=>location.href.split('/Lesson-Studio/')[0]+'/Lesson-Studio/visitor.html?id='+encodeURIComponent(id);
function qrUrl(text){return 'https://quickchart.io/qr?size=260&margin=2&text='+encodeURIComponent(text)}
function zoom(src){document.getElementById('zimg').src=src;document.getElementById('zoom').classList.add('open')}
function setupTimer(min){if(timer){clearInterval(timer);timer=null}remain=(min||5)*60;paint();document.getElementById('tstart')?.addEventListener('click',()=>{if(timer)return;timer=setInterval(()=>{if(remain>0){remain--;paint()}else{clearInterval(timer);timer=null}},1000)});document.getElementById('tpause')?.addEventListener('click',()=>{if(timer){clearInterval(timer);timer=null}});document.getElementById('treset')?.addEventListener('click',()=>{if(timer){clearInterval(timer);timer=null}remain=(min||5)*60;paint()})}
function paint(){let e=document.getElementById('clock');if(e)e.textContent=String(Math.floor(remain/60)).padStart(2,'0')+':'+String(remain%60).padStart(2,'0')}
function render(){
 const s=slides[idx];if(!s)return;let nav=slides.map((x,i)=>'<button data-i="'+i+'" class="'+(i===idx?'active':'')+'"><b>'+(i+1)+'. '+esc(x.title)+'</b><small>'+esc(x.time||5)+' min</small></button>').join('');
 let imgs=(s.images||[]).slice();if(s.img&&!imgs.includes(s.img))imgs.unshift(s.img);
 let visual=imgs.length?'<div class="gallery '+(imgs.length>1?'multi':'')+'">'+imgs.map((src,i)=>'<div class="card"><img data-src="'+i+'"></div>').join('')+'</div>':'<div><b>'+esc(s.title)+'</b><p>No activity picture.</p></div>';
 let q=(s.questions||[]).map(x=>typeof x==='string'?{q:x,a:''}:x);let qhtml=q.length?'<div class="questionLayer">'+q.map((x,i)=>'<button data-q="'+i+'">'+(i+1)+'</button>').join('')+'</div>':'';
 let timerHtml='<div class="timer"><div class="clock" id="clock">05:00</div><button id="tstart">▶ Start</button><button id="tpause">Ⅱ Pause</button><button id="treset">↻ Reset</button></div>';
 let plan=planLink(lesson.id);
 let body=s.type==='Reading'?'<div class="slide" style="grid-template-columns:1fr"><div class="visual"><div class="reading"><div class="poster">'+(s.img?'<img id="readimg">':'<b>Reading Routine</b>')+'</div><div class="tools">'+timerHtml+'<div class="panel"><b>⭐ Reading Groups</b><p>Use this routine with your class.</p></div></div></div></div></div>':'<div class="slide"><div class="visual">'+visual+qhtml+'</div><aside class="details"><span>'+esc((s.type||'ACTIVITY').toUpperCase())+'</span><h2>'+esc(s.title)+'</h2>'+(s.showInstructions===false?'':'<div class="mission">'+esc(s.mission||'')+'</div>')+'<div>'+(s.page&&s.page!=='—'?'<span class="badge">📖 Page '+esc(s.page)+'</span>':'')+((s.objectives||[])[0]?'<span class="badge">🎯 '+esc(s.objectives[0])+'</span>':'')+'</div>'+timerHtml+(s.aud?'<div class="audio"><b>🎧 Activity Audio</b><audio id="aud" controls></audio></div>':'')+'</aside></div>';
 document.getElementById('root').className='app';document.getElementById('root').innerHTML='<aside class="nav"><div class="brand">✨ Lesson Agenda</div>'+nav+'</aside><main class="main"><div class="top"><div><h1>'+esc(s.lesson||lesson.title||'Lesson')+'</h1><p>'+esc(s.sub||'')+'</p></div><div class="actions"><img class="qr" src="'+qrUrl(plan)+'" title="Lesson Plan QR" id="planQR"><button id="planBtn">📋 Lesson Plan</button><button id="fs">⛶ Full Screen</button></div></div>'+body+'</main>';
 document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{idx=+b.dataset.i;render()});document.getElementById('planBtn').onclick=()=>window.open(plan,'_blank');document.getElementById('planQR').onclick=()=>window.open(plan,'_blank');document.getElementById('fs').onclick=async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch(e){}};
 if(s.type==='Reading'&&s.img){let im=document.getElementById('readimg');im.src=s.img;im.onclick=()=>zoom(s.img)}else document.querySelectorAll('[data-src]').forEach(im=>{let src=imgs[+im.dataset.src];im.src=src;im.onclick=()=>zoom(src)});
 if(s.aud){document.getElementById('aud').src=s.aud}setupTimer(s.time||5);
 document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{document.querySelector('.qcard')?.remove();let x=q[+b.dataset.q],c=document.createElement('div');c.className='qcard';c.innerHTML='<b>Question '+(+b.dataset.q+1)+'</b><p>'+esc(x.q)+'</p>'+(x.a?'<button class="reveal">✨ Reveal Answer</button><div class="ans" hidden><b>Answer:</b> '+esc(x.a)+'</div>':'');document.querySelector('.visual').appendChild(c);let r=c.querySelector('.reveal');if(r)r.onclick=()=>{c.querySelector('.ans').hidden=false;r.remove()}}); 
}
async function load(){let id=new URLSearchParams(location.search).get('id');if(!id)return document.getElementById('root').innerHTML='<h2>Shared lesson unavailable</h2>';try{let r=await fetch(API+'/rest/v1/lesson_plans?id=eq.'+encodeURIComponent(id)+'&select=id,title,grade,lesson_data',{headers:{apikey:KEY,Authorization:'Bearer '+KEY}});if(!r.ok)throw 0;let rows=await r.json(),x=rows[0];if(!x||!x.lesson_data||!Array.isArray(x.lesson_data.slides))throw 0;lesson=x;slides=x.lesson_data.slides;render()}catch(e){document.getElementById('root').innerHTML='<h2>Shared lesson unavailable</h2><p>Please ask the lesson owner to open and save/update this lesson once, then use the Share Lesson button again.</p>'}}
document.getElementById('zclose').onclick=()=>document.getElementById('zoom').classList.remove('open');document.getElementById('zoom').onclick=e=>{if(e.target.id==='zoom')e.currentTarget.classList.remove('open')};load();
</script></body></html>
