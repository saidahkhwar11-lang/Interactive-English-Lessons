<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lesson Studio Access</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#eef9f3,#e8f6ff 55%,#fff5d8);color:#173f67;min-height:100vh;display:grid;place-items:center}.box{width:min(820px,92vw);background:#fff;border-radius:28px;padding:34px;box-shadow:0 20px 60px #173f6720;text-align:center}h1{margin:0 0 8px;font-size:38px}.sub{color:#698294;margin-bottom:28px}.roles{display:grid;grid-template-columns:1fr 1fr;gap:18px}.role{border:1px solid #d9e7ed;border-radius:22px;padding:28px;background:#fbfdfe}.ico{font-size:48px}.role h2{margin:10px 0 6px}.role p{color:#6a8292;min-height:44px}.role button{border:0;border-radius:13px;padding:12px 20px;font-weight:900;cursor:pointer;color:#fff;background:#174f78}.visitor button{background:#4f8b72}.login{display:none;margin-top:16px}.login.show{display:block}.login input{width:100%;padding:11px;border:1px solid #cbdde5;border-radius:10px;margin:5px 0}.note{font-size:11px;color:#78909e;margin-top:22px}@media(max-width:650px){.roles{grid-template-columns:1fr}}</style></head><body><main class="box"><div style="font-size:42px">✨</div><h1>Lesson Studio</h1><div class="sub">Al Reyadah School · English Department</div><div class="roles"><section class="role"><div class="ico">🔐</div><h2>Admin</h2><p>Full Lesson Studio access for the coordinator.</p><button id="admin">Admin Login</button><div class="login" id="adminLogin"><input id="pass" type="password" placeholder="Admin password"><button id="enter">Enter Lesson Studio</button><div id="err" style="color:#a34b58;font-size:12px;margin-top:6px"></div></div></section><section class="role visitor"><div class="ico">👩‍🏫</div><h2>Visitor / Teacher</h2><p>Open shared lessons for classroom presentation.</p><button onclick="location.href='visitor-library.html'">Enter Teacher Library</button></section></div><div class="note">Visitors cannot access My Library, lesson editing, backups or creator controls.</div></main><script>document.getElementById('admin').onclick=()=>document.getElementById('adminLogin').classList.toggle('show');document.getElementById('enter').onclick=()=>{let p=document.getElementById('pass').value;if(p===localStorage.getItem('LessonStudioAdminPassword'))location.href='index.html';else if(!localStorage.getItem('LessonStudioAdminPassword')&&p.length>=6){localStorage.setItem('LessonStudioAdminPassword',p);location.href='index.html'}else document.getElementById('err').textContent='Incorrect password.'};</script></body></html>
