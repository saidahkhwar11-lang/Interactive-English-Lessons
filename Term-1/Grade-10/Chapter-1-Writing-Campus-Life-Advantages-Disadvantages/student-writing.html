<!doctype html><meta charset=utf-8><title>Student Writing · Campus Life</title><style>body{font-family:Arial;background:#f3f7fb;color:#172540}.w{max-width:850px;margin:auto}.c{background:#fff;padding:15px;margin:12px;border-radius:14px}textarea,input{width:100%;box-sizing:border-box;padding:10px;margin-top:7px;border:1px solid #ccd8e5;border-radius:9px;font:inherit}textarea{height:110px}.long{height:170px}.parts{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;text-align:center;font-weight:bold}.parts div{background:#eaf7f7;padding:9px;border-radius:9px}button{padding:12px;background:#172540;color:white;border:0;border-radius:9px;font-weight:bold}@media(max-width:650px){.parts{grid-template-columns:1fr}}</style><div class=w><h1>Campus Life · Extended Paragraph</h1><p>Complete all five parts before sending your writing.</p><div class="c parts"><div>1. Topic Sentence</div><div>2. Advantages</div><div>3. Disadvantages</div><div>4. Evidence / Examples</div><div>5. Conclusion</div></div><div class=c><b>Your Name</b><input id=sn placeholder="Write your full name"></div><div class=c><b>Topic Sentence</b><textarea id=ts placeholder="Introduce campus living and the balanced viewpoint."></textarea></div><div class=c><b>Advantages</b><textarea class=long id=ad placeholder="Develop TWO advantages with details."></textarea></div><div class=c><b>Disadvantages</b><textarea class=long id=ds placeholder="Develop TWO disadvantages with details."></textarea></div><div class=c><b>Evidence / Examples</b><textarea id=ev placeholder="Add relevant evidence or examples from your planning/research."></textarea></div><div class=c><b>Conclusion</b><textarea id=co placeholder="Finish with a thoughtful, reasoned conclusion."></textarea></div><button onclick=go()>Send to Teacher Live Board</button><p id=m></p></div><script>async function go(){if(!sn.value.trim()||!ts.value.trim()||!ad.value.trim()||!ds.value.trim()||!ev.value.trim()||!co.value.trim()){m.textContent='Please complete your name and all five paragraph parts.';return}let r=await fetch('https://hobfifobduqslvnagwlb.supabase.co/functions/v1/email-writing-live',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({student_name:sn.value.trim(),class_name:'Grade 10 Campus Writing',greeting_opening:'Topic Sentence: '+ts.value,body1:'Advantages: '+ad.value+'\n\nDisadvantages: '+ds.value,body2:'Evidence / Examples: '+ev.value,closing_signature:'Conclusion: '+co.value})});m.textContent=r.ok?'Sent ✓':'Try again'}</script>
