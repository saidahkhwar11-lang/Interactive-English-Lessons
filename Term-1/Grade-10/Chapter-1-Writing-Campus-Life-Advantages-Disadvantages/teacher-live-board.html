<!doctype html><meta charset=utf-8><title>Teacher Live Board · Campus Life</title><style>body{font-family:Arial;background:#f3f7fb;margin:0;color:#17233f}.top{background:#fff;padding:14px;display:flex;gap:10px;position:sticky;top:0}.top h1{flex:1;margin:0}.b{border:0;border-radius:8px;padding:10px;color:#fff;background:#17233f}.grid{padding:18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}.card{background:#fff;padding:14px;border-radius:14px;cursor:pointer}.modal{display:none;position:fixed;inset:0;background:#111b2bdd;padding:5vh}.on{display:block}.paper{background:#fff;max-width:900px;height:80vh;margin:auto;padding:25px;overflow:auto;font-size:19px}.writing{white-space:pre-wrap;line-height:1.55}.eval{margin-top:24px;padding:18px;background:#f7f9fc;border:1px solid #d9e2ee;border-radius:14px}.eval label{display:block;padding:10px 4px;border-bottom:1px dashed #ccd5df}.part{margin:14px 0;padding:14px;border:1px solid #d9e2ee;border-radius:12px;background:#fff}.part h3{margin:0 0 8px;color:#405fa8}.parttext{white-space:pre-wrap;line-height:1.55}.partcheck{margin-top:10px;padding-top:8px;border-top:1px dashed #ccd5df}.partcheck label{display:block;padding:6px 0;border:0;font-size:16px}.note{width:100%;min-height:70px;box-sizing:border-box;margin-top:12px;padding:10px}</style><div class=top><h1>Live Campus Life Writing Board <span id=n></span></h1><button class=b onclick=load()>Refresh</button></div><div id=w class=grid></div><div id=mo class=modal onclick="if(event.target===this)this.classList.remove('on')"><div id=p class=paper></div></div><script>let d=[];const E='https://hobfifobduqslvnagwlb.supabase.co/functions/v1/email-writing-live',e=s=>String(s||'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));async function load(){let all=await(await fetch(E)).json();d=all.filter(x=>x.class_name==='Grade 10 Campus Writing');n.textContent='('+d.length+')';w.innerHTML=d.length?'':'No submissions yet.';d.forEach((x,i)=>{let q=document.createElement('div');q.className='card';q.innerHTML='<h3>'+e(x.student_name)+'</h3><p>'+e(x.greeting_opening).slice(0,180)+'</p>';q.onclick=()=>openOne(i);w.appendChild(q)})}function openOne(i){let x=d[i],parts=String(x.body1||'').split('\n\nDisadvantages: '),adv=parts[0].replace(/^Advantages:\s*/,''),dis=parts[1]||'';p.innerHTML='<button class=b onclick="mo.classList.remove(\'on\')">Close</button><h2>'+e(x.student_name)+'</h2><div class="part"><h3>1 · Topic Sentence</h3><div class=parttext>'+e(String(x.greeting_opening||'').replace(/^Topic Sentence:\s*/,''))+'</div><div class=partcheck><label><input type="checkbox"> Clear, balanced topic sentence</label></div></div><div class="part"><h3>2 · Advantages</h3><div class=parttext>'+e(adv)+'</div><div class=partcheck><label><input type="checkbox"> TWO developed advantages</label><label><input type="checkbox"> Relevant supporting details</label></div></div><div class="part"><h3>3 · Disadvantages</h3><div class=parttext>'+e(dis)+'</div><div class=partcheck><label><input type="checkbox"> TWO developed disadvantages</label><label><input type="checkbox"> Clear contrast / transition</label></div></div><div class="part"><h3>4 · Evidence / Examples</h3><div class=parttext>'+e(String(x.body2||'').replace(/^Evidence \/ Examples:\s*/,''))+'</div><div class=partcheck><label><input type="checkbox"> Evidence / examples are relevant</label><label><input type="checkbox"> Ideas are in the student’s own words</label></div></div><div class="part"><h3>5 · Conclusion</h3><div class=parttext>'+e(String(x.closing_signature||'').replace(/^Conclusion:\s*/,''))+'</div><div class=partcheck><label><input type="checkbox"> Thoughtful, reasoned conclusion</label></div></div><div class="eval"><h3>Overall Writing Check</h3><label><input type="checkbox"> Campus-life vocabulary used accurately</label><label><input type="checkbox"> Linking words connect ideas effectively</label><label><input type="checkbox"> Ideas are organized logically</label><label><input type="checkbox"> Spelling, capitals and punctuation checked</label><textarea class=note placeholder="Teacher feedback / one next step..."></textarea></div>';mo.classList.add('on')}load();setInterval(load,3000)</script>
