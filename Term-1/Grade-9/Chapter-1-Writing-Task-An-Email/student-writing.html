<!doctype html><meta charset=utf-8><title>Student Writing</title><style>body{font-family:Arial;background:#f3f7fb;color:#17233f}.w{max-width:800px;margin:auto}.c{background:#fff;padding:15px;margin:12px;border-radius:14px}textarea{width:100%;height:95px;box-sizing:border-box;margin-top:7px;padding:10px;border:1px solid #ccd8e5;border-radius:9px;font:inherit}input{width:100%;box-sizing:border-box;padding:10px;margin-top:7px;border:1px solid #ccd8e5;border-radius:9px;font:inherit}button{padding:12px;background:#17233f;color:white;border:0;border-radius:9px;font-weight:bold}.hint{font-size:14px;color:#66758b;margin-top:5px}</style><div class=w><h1>Write Your Email</h1><p>Complete all five parts of your email.</p><div class=c><b>Your Name</b><input id=sn maxlength=80 placeholder="Write your full name"></div><div class=c><b>1. Greeting</b><textarea id=gr placeholder="Dear... / Hi..."></textarea></div><div class=c><b>2. Opening</b><textarea id=op placeholder="How are you? I hope..."></textarea></div><div class=c><b>3. Body Paragraph</b><textarea id=bp placeholder="Write ONE clear body paragraph with a main idea and supporting details."></textarea><div class=hint>Use Chapter 1 vocabulary and at least two prepositions of place.</div></div><div class=c><b>4. Closing</b><textarea id=cl placeholder="I hope to hear from you soon... / See you soon..."></textarea></div><div class=c><b>5. Signature</b><textarea id=sg placeholder="Best wishes,&#10;Your name"></textarea></div><button onclick=go()>Send to Teacher Screen</button><p id=m></p></div><script>async function go(){if(!sn.value.trim()){m.textContent='Please write your name first.';return}if(!gr.value.trim()||!op.value.trim()||!bp.value.trim()||!cl.value.trim()||!sg.value.trim()){m.textContent='Please complete all five email parts before sending.';return}let r=await fetch('https://hobfifobduqslvnagwlb.supabase.co/functions/v1/email-writing-live',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({student_name:sn.value.trim(),class_name:'Class',greeting_opening:'Greeting: '+gr.value+'\n\nOpening: '+op.value,body1:bp.value,body2:'',closing_signature:'Closing: '+cl.value+'\n\nSignature: '+sg.value})});m.textContent=r.ok?'Sent ✓':'Try again'}</script>
