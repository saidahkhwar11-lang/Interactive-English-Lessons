<!doctype html><meta charset=utf-8><title>Live Writing Board</title><style>body{font-family:Arial;background:#f3f7fb;margin:0;color:#17233f}.top{background:#fff;padding:14px;display:flex;gap:10px;position:sticky;top:0}.top h1{flex:1;margin:0}.b{border:0;border-radius:8px;padding:10px;color:#fff;background:#17233f}.red{background:#a52c3d}.grid{padding:18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}.card{background:#fff;padding:14px;border-radius:14px;cursor:pointer}.modal{display:none;position:fixed;inset:0;background:#111b2bdd;padding:5vh}.on{display:block}.paper{background:#fff;max-width:900px;height:80vh;margin:auto;padding:25px;overflow:auto;font-size:20px}.writing{white-space:pre-wrap}.eval{margin-top:24px;padding:18px;background:#f7f9fc;border:1px solid #d9e2ee;border-radius:14px}.eval h3{margin:0 0 10px}.eval label{display:block;padding:10px 4px;border-bottom:1px dashed #ccd5df;font-size:17px}.eval input{width:20px;height:20px;margin-right:9px;vertical-align:middle}.note{width:100%;min-height:70px;box-sizing:border-box;margin-top:12px;padding:10px;border:1px solid #b9c6d6;border-radius:9px;font:inherit}</style><div class=top><h1>Live Student Email Board <span id=n></span></h1><button class=b onclick=load()>Refresh</button><button class="b red" onclick=clearAll()>Clear All</button></div><div id=w class=grid></div><div id=mo class=modal onclick="if(event.target===this)this.classList.remove('on')"><div id=p class=paper></div></div><script>let d=[];const E='https://hobfifobduqslvnagwlb.supabase.co/functions/v1/email-writing-live',e=s=>String(s||'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));async function load(){d=await(await fetch(E)).json();n.textContent='('+d.length+')';w.innerHTML=d.length?'':'No submissions yet.';d.forEach((x,i)=>{let q=document.createElement('div');q.className='card';q.innerHTML='<h3>'+e(x.student_name)+'</h3><p>'+e(x.greeting_opening)+'<br>'+e(x.body1).slice(0,130)+'</p>';q.onclick=()=>openOne(i);w.appendChild(q)})}function openOne(i){let x=d[i];p.innerHTML='<button class=b onclick="mo.classList.remove(\'on\')">Close</button><h2>'+e(x.student_name)+'</h2><div class="writing">'+e(x.greeting_opening)+'\n\n'+e(x.body1)+'\n\n'+e(x.body2)+'\n\n'+e(x.closing_signature)+'</div><div class="eval"><h3>Teacher Quick Evaluation</h3><label><input type="checkbox"> Correct email structure: greeting, opening, body, closing & signature</label><label><input type="checkbox"> Ideas are clear and organized</label><label><input type="checkbox"> Chapter 1 vocabulary is used appropriately</label><label><input type="checkbox"> Prepositions of place are used correctly</label><label><input type="checkbox"> Spelling, capitals and punctuation are accurate</label><textarea class="note" placeholder="Teacher feedback / one next step..."></textarea></div>';mo.classList.add('on')}async function clearAll(){if(!confirm('Delete ALL responses?'))return;let pin=prompt('Teacher PIN');if(!pin)return;let r=await fetch(E,{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin})});if(!r.ok){alert('Incorrect PIN');return}load()}load();setInterval(load,3000);</script>
