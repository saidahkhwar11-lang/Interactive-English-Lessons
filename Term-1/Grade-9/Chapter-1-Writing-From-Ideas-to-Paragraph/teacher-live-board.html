<!doctype html><meta charset=utf-8><title>Teacher Live Board · Extended Paragraph</title><style>body{font-family:Arial;background:#f3f7fb;margin:0;color:#17233f}.top{background:#fff;padding:14px;display:flex;gap:10px;position:sticky;top:0}.top h1{flex:1;margin:0}.b{border:0;border-radius:8px;padding:10px;color:#fff;background:#17233f}.grid{padding:18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}.card{background:#fff;padding:14px;border-radius:14px;cursor:pointer}.modal{display:none;position:fixed;inset:0;background:#111b2bdd;padding:5vh}.on{display:block}.paper{background:#fff;max-width:900px;height:80vh;margin:auto;padding:25px;overflow:auto;font-size:19px}.writing{white-space:pre-wrap;line-height:1.5}.eval{margin-top:24px;padding:18px;background:#f7f9fc;border:1px solid #d9e2ee;border-radius:14px}.eval label{display:block;padding:10px 4px;border-bottom:1px dashed #ccd5df}.note{width:100%;min-height:70px;box-sizing:border-box;margin-top:12px;padding:10px}</style><div class=top><h1>Live Extended Paragraph Board <span id=n></span></h1><button class=b onclick=load()>Refresh</button></div><div id=w class=grid></div><div id=mo class=modal onclick="if(event.target===this)this.classList.remove('on')"><div id=p class=paper></div></div><script>let d=[];const E='https://hobfifobduqslvnagwlb.supabase.co/functions/v1/email-writing-live',e=s=>String(s||'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));async function load(){let all=await(await fetch(E)).json();d=all.filter(x=>x.class_name==='Grade 9 Writing');n.textContent='('+d.length+')';w.innerHTML=d.length?'':'No paragraph submissions yet.';d.forEach((x,i)=>{let q=document.createElement('div');q.className='card';q.innerHTML='<h3>'+e(x.student_name)+'</h3><p>'+e(x.greeting_opening).slice(0,180)+'</p>';q.onclick=()=>openOne(i);w.appendChild(q)})}function openOne(i){let x=d[i];p.innerHTML='<button class=b onclick="mo.classList.remove(\'on\')">Close</button><h2>'+e(x.student_name)+'</h2><div class="writing">'+e(x.greeting_opening)+'\n\n'+e(x.body1)+'\n\n'+e(x.body2)+'\n\n'+e(x.closing_signature)+'</div><div class="eval"><h3>Teacher Quick Evaluation</h3><label><input type="checkbox"> Clear topic sentence</label><label><input type="checkbox"> At least TWO developed supporting points</label><label><input type="checkbox"> Relevant example / evidence</label><label><input type="checkbox"> Ideas are organized logically</label><label><input type="checkbox"> Linking words connect ideas clearly</label><label><input type="checkbox"> Ideas are in the student’s own words</label><label><input type="checkbox"> Effective concluding sentence</label><label><input type="checkbox"> Spelling, capitals and punctuation checked</label><textarea class=note placeholder="Teacher feedback / one next step..."></textarea></div>';mo.classList.add('on')}load();setInterval(load,3000)</script>
