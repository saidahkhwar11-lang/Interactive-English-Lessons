const reading=[
{title:'Exploring',passage:'Exploring is an important part of our world. Today, many people are modern explorers. They travel to mountains, deserts, oceans and forests to learn more about our planet. Some explorers join scientific expeditions, while others explore new places by themselves. Exploration has changed a lot over time. In the past, explorers often travelled by ship or on foot and had maps that were not always correct. Now they use modern technology, such as satellites and GPS, to plan their route and stay safe. However, exploring is still difficult. Explorers can face bad weather, dangerous animals and remote places with few supplies. They must be strong, prepared and able to solve problems. Despite the challenges, explorers continue to take these journeys because they are curious, want to discover new things and help us understand our amazing world.',qs:[['Where do modern explorers travel to learn more about our planet?',['Only in cities','To mountains, deserts, oceans and forests','Only by ship'],1],['What did explorers often use in the past?',['Satellites and GPS','Mobile phones','Maps that were not always correct'],2],['Why do some explorers join scientific expeditions?',['Sell supplies','Learn about the world','Avoid travelling'],1],['Which technology helps explorers plan their route and stay safe?',['Avoid travelling','Learn about the world','Satellites and GPS'],2],['Which challenge can explorers face?',['Bad weather','Easy roads','Crowded shops'],0],['Why must explorers be strong and prepared?',['They travel only in cities','They may face bad weather or dangerous animals','They never need supplies'],1],['What does “remote places” mean?',['Places near a school','Places far away','Places with many shops'],1],['What is the main idea?',['Technology stopped exploration','Explorers only travel by ship','Exploring helps us understand the world'],2]]},
{title:'An Unexpected Visitor',passage:'It was a clear night, and we were at the observatory on a school trip. The sky was dark and full of stars, and our teacher was showing us the planets through a powerful telescope. We were looking at Jupiter when something caught her attention.\n\nA small, bright object was moving quickly across the sky. At first, we thought it was a satellite, but it moved differently. Our teacher explained that it might be an asteroid passing near Earth. We watched as it travelled, a tiny dot of light against the black sky.\n\nLater, we learned that the asteroid was not dangerous. It would pass by and continue on its journey around the Sun. Even so, it was a special moment for all of us. We felt excited to see a real space event, and it reminded us how big and amazing our solar system is.',qs:[['Where does the story take place?',['In a desert','At an observatory','At a school'],1],['What were the students looking at through the telescope?',['Jupiter','The Sun','The Moon'],0],['What caught the teacher’s attention?',['A planet changing colour','A small, bright object moving across the sky','A new star appearing'],1],['What did the teacher think the object might be?',['A comet','An asteroid','A satellite'],1],['Was the asteroid dangerous?',['No','Yes','The passage does not say'],0],['How did the students feel about seeing the space event?',['Worried','Excited','Tired'],1],['Which activity is most similar to what the students did?',['Drawing a city map','Watching the sky through a telescope to learn','Playing a computer game about space'],1],['What is the main idea?',['Students get lost during a school trip','Students build a new observatory','Students observe a bright space asteroid'],2]]},
{title:'My Free Time',passage:'My name is Sara. I am twelve years old. I enjoy doing different activities in my free time. After school, I usually finish my homework and then relax for a while.\n\nOn weekdays, I like reading books and drawing pictures. Sometimes, I play computer games with my brother. I also help my mother in the kitchen. We sometimes cook dinner together.\n\nAt the weekend, I spend more time outdoors. On Saturday morning, I usually ride my bike in the park with my friends. In the afternoon, we sometimes play volleyball or go for a walk. I enjoy being outside because it makes me feel happy and active.\n\nLast weekend, my family visited my grandparents. We had lunch together and talked about our week. In the evening, I watched a movie with my cousins. It was a wonderful weekend.',qs:[['How old is Sara?',['10 years old','12 years old','13 years old'],1],['What does Sara usually do after school first?',['Finishes her homework','Rides her bike','Visits her grandparents'],0],['What does Sara like doing on weekdays?',['Swimming and running','Reading and drawing','Shopping and travelling'],1],['Who does Sara sometimes play computer games with?',['Her cousin','Her friend','Her brother'],2],['Where does Sara help her mother?',['In the garden','In the kitchen','At school'],1],['What does Sara usually do on Saturday morning?',['Rides her bike','Watches a movie','Plays computer games'],0],['Why does Sara enjoy being outside?',['It makes her tired','It makes her hungry','It makes her happy and active'],2],['Who did Sara’s family visit last weekend?',['Her teacher','Her grandparents','Her friends'],1],['What did Sara do with her cousins?',['Watched a movie','Played volleyball','Cooked dinner'],0],['How did Sara feel about her weekend?',['It was boring','It was difficult','It was wonderful'],2]]},
{title:'Bees and Beekeepers in the UAE',passage:'Bees are small insects, but they are very important. In the UAE, beekeepers take care of bees and keep them in special boxes called beehives. Bees fly from flower to flower to collect nectar and pollen. They also help plants grow by carrying pollen between flowers.\n\nBeekeepers have an important job. They check the beehives, make sure the bees are healthy, and collect honey. They wear special protective clothes, gloves, and a face covering when they work near the bees.\n\nThe UAE has different types of honey. Bees can collect nectar from local plants and trees, including the Sidr tree. Beekeeping supports local food production and helps protect the environment.\n\nWe should protect bees because they are important for plants, farms, and nature. Planting more flowers and avoiding harm to bees can help them survive.',qs:[['Where do beekeepers keep bees?',['In beehives','In rivers','In classrooms'],0],['What do bees collect from flowers?',['Sand and stones','Nectar and pollen','Water and salt'],1],['How do bees help plants?',['By cutting them','By carrying pollen','By eating all the flowers'],1],['What does a beekeeper do?',['Takes care of bees','Builds roads','Drives buses'],0],['Why do beekeepers wear protective clothes?',['To go swimming','To stay safe near bees','To play sports'],1],['What do beekeepers collect?',['Milk','Honey','Rice'],1],['Which UAE tree is mentioned?',['Apple tree','Sidr tree','Pine tree'],1],['Beekeeping can help protect the _____.',['environment','computer','classroom'],0],['Why should we protect bees?',['They help plants and nature','They make the desert colder','They build houses'],0],['What is the main idea?',['Bees are dangerous insects','Beekeepers only work at night','Bees and beekeepers are important to nature and the UAE'],2]]},
{title:'Camels in the UAE',passage:'Camels are important animals in the UAE. They have lived in the desert with Emirati people for many years. In the past, people used camels for transportation because they could travel long distances across the hot desert.\n\nCamels are well adapted to desert life. They have long legs that keep their bodies away from the hot sand. Their wide feet help them walk easily on soft sand. They can also live for several days without drinking water.\n\nIn the past, camels helped people carry food, water, and other things from one place to another. Today, camels are still an important part of Emirati culture and heritage. People care for camels and enjoy camel racing. Camels remind us of the UAE’s history and traditional desert life.',qs:[['Where do camels live?',['In the ocean','In the desert','In the forest'],1],['What did people use camels for in the past?',['Transportation','Swimming','Fishing'],0],['Why do camels have long legs?',['To climb trees','To swim quickly','To keep away from hot sand'],2],['What helps camels walk on soft sand?',['Small ears','Wide feet','Long tails'],1],['Camels can live for several days without _____.',['books','grass','water'],2],['What did camels carry in the past?',['Food and water','Computers','Televisions'],0],['Camels are important to Emirati _____.',['technology','culture and heritage','schools'],1],['What activity do people enjoy today?',['Camel racing','Camel swimming','Camel flying'],0],['What does “adapted” mean?',['Able to live well in an environment','Unable to move','Very small'],0],['What is the main idea?',['Camels only live on farms','Camels are important animals in UAE history and culture','Camels cannot live in the desert'],1]]},
{title:'Falconry in the UAE',passage:'Falconry is an important part of Emirati culture and heritage. For many years, people in the UAE have trained and cared for falcons. In the past, falcons helped people hunt for food in the desert.\n\nFalcons are strong and fast birds. They have sharp eyes, strong wings, and sharp claws. These features help them fly quickly and find their prey. A person who trains and cares for a falcon is called a falconer.\n\nFalconers must take good care of their birds. They give them food and water, keep them healthy, and train them carefully. Falconers often wear a special glove when holding a falcon on their hand.\n\nToday, falconry is still popular in the UAE. People practice it to keep Emirati traditions alive and teach younger generations about their heritage. Protecting falcons and their natural environment is also important for the future.',qs:[['What is falconry an important part of?',['Emirati culture and heritage','Computer technology','Sea life'],0],['What did falcons help people do in the past?',['Build houses','Hunt for food','Grow trees'],1],['Falcons are strong and _____ birds.',['slow','small','fast'],2],['What helps falcons find their prey?',['Sharp eyes','Long tails','Small wings'],0],['What is a person who trains a falcon called?',['Farmer','Falconer','Fisherman'],1],['What do falconers give their birds?',['Food and water','Books and pencils','Toys and games'],0],['What does a falconer often wear?',['A special glove','A swimming cap','A school bag'],0],['Why is falconry still practiced today?',['To keep Emirati traditions alive','To build new roads','To learn computers'],0],['What should we protect?',['Falcons and their natural environment','Only buildings','Cars and buses'],0],['What is the main idea?',['Falcons are pets found in every home','Falconry is an important Emirati tradition','Falcons live in the sea'],1]]},
{title:'The Laughing Hyena',passage:'Hyenas are interesting wild animals. They live in parts of Africa and Asia. They can live in grasslands, deserts, and other dry areas. Hyenas have strong bodies, powerful jaws, and sharp teeth.\n\nSome hyenas are famous for making sounds that seem like human laughter. However, they are not really laughing. They use different sounds to communicate with other hyenas. These sounds can show excitement, fear, or help them communicate with their group.\n\nHyenas usually eat meat. They are strong hunters, but they may also eat animals that have already died. Their powerful jaws help them break bones and eat tough food.\n\nHyenas are important to the ecosystem because they help clean the environment by eating dead animals. Like other wild animals, hyenas need safe habitats where they can find food and survive. We should respect and protect wildlife and their natural habitats.',qs:[['Where do hyenas live?',['Africa and Asia','Antarctica only','Under the ocean'],0],['Where can hyenas live?',['Only in water','Grasslands and dry areas','Only in snowy mountains'],1],['What do hyenas have?',['Weak jaws','Wings','Powerful jaws'],2],['Why do some hyenas make laughing sounds?',['To communicate','To sing songs','To entertain people'],0],['Hyenas usually eat _____.',['chocolate','meat','rice'],1],['What helps hyenas break bones?',['Their tails','Their powerful jaws','Their fur'],1],['Hyenas are strong _____.',['hunters','swimmers','farmers'],0],['Why are hyenas important to the ecosystem?',['They build houses','They help clean the environment','They grow plants'],1],['What do wild hyenas need to survive?',['Safe habitats and food','Computers','Cars'],0],['What is the main idea?',['Hyenas are interesting wild animals with important roles in nature','Hyenas are farm animals','Hyenas only eat plants'],0]]},
{title:'Horse Riding in the UAE',passage:'Horse riding is an important part of Emirati culture and heritage. Horses have been part of life in the UAE for many years. In the past, people rode horses to travel from one place to another. Horses were also valued for their speed, strength, and beauty.\n\nArabian horses are famous for being strong, intelligent, and fast. Riders must learn how to care for their horses. They give them food and clean water, brush their coats, and make sure they have a safe place to rest.\n\nToday, horse riding is a popular sport in the UAE. People enjoy riding horses for fun and taking part in competitions. Endurance riding is especially popular. In endurance races, horses and riders travel long distances, so they must be fit and well trained.\n\nHorse riding helps younger generations learn about Emirati traditions. It also teaches riders responsibility, patience, and respect for animals. We should always care for horses and protect their health.',qs:[['Horse riding is an important part of _____.',['Emirati culture and heritage','computer technology','sea life'],0],['Why did people ride horses in the past?',['To travel','To swim','To catch fish'],0],['Arabian horses are famous for being _____.',['weak and slow','strong, intelligent, and fast','small and lazy'],1],['What do riders give their horses?',['Food and clean water','Books and pencils','Toys and games'],0],['Why do riders brush their horses?',['To care for them','To make them fly','To teach them to read'],0],['Horse riding is a popular _____ in the UAE.',['sport','school subject','building'],0],['What type of riding is especially popular?',['Endurance riding','Bicycle riding','Motorcycle riding'],0],['What happens in endurance races?',['Horses travel long distances','Horses swim in the sea','Horses pull buses'],0],['What can horse riding teach riders?',['Responsibility and patience','How to build a computer','How to cook'],0],['What is the main idea?',['Horse riding is only for children','Horse riding is an important Emirati tradition and sport','Horses are sea animals'],1]]},
{title:'The Solar System',passage:'The solar system is made up of the Sun, eight planets, moons, asteroids, and other objects. The Sun is a huge, hot star at the center of the solar system. It gives light and heat to the planets.\n\nThe eight planets are Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus, and Neptune. Each planet is different. Mercury is the closest planet to the Sun. Venus is very hot. Earth is the only planet that we know has life. Mars is called the “red planet”. Jupiter is the biggest planet. Saturn is famous for its rings. Uranus and Neptune are very far from the Sun and are very cold.\n\nPlanets move around the Sun in a path called an orbit. The Moon moves around Earth. Some planets have many moons.\n\nThe UAE is interested in space and has sent a spacecraft called Hope to explore Mars. Learning about the solar system helps us understand our universe and inspires future scientists.',qs:[['What is at the center of the solar system?',['Earth','The Moon','The Sun'],2],['How many planets are in the solar system?',['6','7','8'],2],['Which planet is closest to the Sun?',['Earth','Venus','Mercury'],2],['Which planet is known as the red planet?',['Mars','Jupiter','Neptune'],0],['Which planet is the biggest?',['Earth','Mars','Jupiter'],2],['Which planet is famous for its rings?',['Mercury','Venus','Saturn'],2],['What moves around Earth?',['The Sun','The Moon','Mars'],1],['What is the path that planets move around the Sun called?',['Road','Orbit','River'],1],['Which planet is very cold and far from the Sun?',['Earth','Uranus','Mars'],1],['What has the UAE sent to explore Mars?',['A car','A spacecraft called Hope','A plane'],1]]},
{title:'The Planets',passage:'The solar system has eight planets. The planets move around the Sun in an orbit. The Sun is a huge, hot star that gives light and heat to the planets. Each planet is different. They have different sizes, temperatures and features.\n\nMercury is the closest planet to the Sun. Venus is very hot. Earth is the only planet we know that has life. Mars is called the “red planet” because it looks red. Jupiter is the biggest planet. Saturn is famous for its beautiful rings. Uranus and Neptune are very far from the Sun and are very cold.\n\nSome planets have moons. We live on Earth, and it has one moon. Learning about the planets helps us understand our solar system and explore space.',qs:[['How many planets are in the solar system?',['6','7','8','9'],2],['Which planet is closest to the Sun?',['Earth','Venus','Mercury','Mars'],2],['Which planet is the hottest?',['Mercury','Venus','Earth','Mars'],1],['Which planet do we live on?',['Mars','Earth','Jupiter','Neptune'],1],['Which planet is known as the red planet?',['Venus','Mars','Saturn','Uranus'],1],['Which planet is the biggest?',['Earth','Jupiter','Neptune','Venus'],1],['Which planet has beautiful rings?',['Jupiter','Saturn','Uranus','Neptune'],1],['Which two planets are very far from the Sun and very cold?',['Mercury and Venus','Jupiter and Saturn','Uranus and Neptune','Earth and Mars'],2],['What gives light and heat to the planets?',['The Moon','The Sun','The stars','The Earth'],1],['Which planet has one moon?',['Mars','Earth','Saturn','Neptune'],1]]},
{title:'The Compass',passage:'A compass is a useful tool that helps people find direction. It has a needle that always points to the north. The needle usually has two colours: red points to the north and the other end points to the south.\n\nPeople have used compasses for many years. Sailors used compasses to travel across the sea and find their way to new places. Explorers used compasses to discover new lands. Today, people still use compasses when driving, hiking, camping, and in many outdoor activities.\n\nA compass shows four main directions: north, south, east, and west. It helps people read maps and find the right direction, even in places where there are no buildings or roads.\n\nThe compass is important because it helps people travel safely and explore the world. It is a simple tool, but it has made a big difference in human history.',qs:[['What is a compass?',['A tool that helps people find direction','A tool for cooking food','A tool for measuring time','A tool for drawing lines'],0],['What does the needle of a compass always point to?',['South','East','West','North'],3],['What colour usually points to the north?',['Blue','Red','Green','Yellow'],1],['Who used compasses to travel across the sea?',['Farmers','Sailors','Teachers','Scientists'],1],['What are the four main directions shown on a compass?',['Up, down, left, right','North, south, east, and west','Morning, afternoon, evening, night','Land, water, air, and space'],1],['What helps people read maps and find the right direction?',['A pencil','A compass','A ruler','A camera'],1],['Where might people use a compass today?',['At home only','When driving, hiking, and camping','At the beach only','At the zoo only'],1],['Why is a compass important?',['It helps people travel safely','It helps people build houses','It helps people taste food','It helps people make clothes'],0],['Which direction is opposite of north?',['South','East','West','Up'],0],['What is the main idea?',['A compass is a simple tool that helps people find direction and has been important for travel and exploration','A compass is a type of planet','A compass is used only for cooking','A compass cannot be used today'],0]]},
{title:'The Comet',passage:'A comet is a big ball of ice, dust, and rock that moves around the Sun. Comets come from very cold and distant places in our solar system, such as the Kuiper Belt or the Oort Cloud. When a comet comes closer to the Sun, the ice begins to melt. The heat turns the ice into gas and dust, which form a bright tail. This tail can be millions of kilometres long.\n\nComets travel around the Sun in long, oval-shaped orbits. Some comets can be seen from Earth, but they only appear for a short time. People have been studying comets for hundreds of years. They help scientists learn more about the solar system and how it was formed.\n\nComets are special because they can give us information about the early history of the solar system. Scientists use telescopes and space missions to study them. In the UAE, we are interested in space and continue to explore and learn about our universe.',qs:[['What is a comet made of?',['Fire and gas','Ice, dust, and rock','Water and sand','Metal and sand'],1],['Where do comets come from?',['The Moon','The Earth','The Kuiper Belt or the Oort Cloud','The ocean'],2],['What happens when a comet comes close to the Sun?',['It becomes bigger','The ice melts and forms a bright tail','It changes into a planet','It disappears into a cloud'],1],['What is a comet’s tail made of?',['Water','Fire','Gas and dust','Ice only'],2],['How do comets move around the Sun?',['In a straight line','In long, oval-shaped orbits','In a circle only','In a square shape'],1],['How long can a comet’s tail be?',['A few metres','A few kilometres','Millions of kilometres','Only 10 kilometres'],2],['How often can some comets be seen from Earth?',['Every day','Only for a short time','Once every hour','All year'],1],['Why do scientists study comets?',['To find water for people','To find out the early history of the solar system','To make new stars','To create new planets'],1],['Which statement is true about comets?',['They are hot and made of metal','They have bright tails when close to the Sun','They do not move around the Sun','They are bigger than the Earth'],1],['What is the main idea?',['Comets are objects that move around the Sun and help us learn about the solar system','Comets are dangerous to all planets','Comets are made of fire only','Comets are the same as stars'],0]]},
{title:'Modern Explorers',passage:'Explorers today do not just travel by ships like in the past. Modern explorers use powerful technology, such as spacecraft, robots, and satellites, to explore new places. They explore space, oceans, and even deserts.\n\nIn space, explorers send spacecraft to study planets, moons, and comets. Robots, like the UAE’s Hope Probe, travel to Mars to collect information and take photos. These missions help scientists learn more about our solar system.\n\nUnder the sea, explorers use special submarines and underwater robots to discover new animals and plants. They study coral reefs and deep oceans to learn how to protect them.\n\nExplorers also study deserts and mountains. In the UAE, scientists and researchers explore the desert using modern tools to understand plants, animals, and the environment. Exploration helps us learn, solve problems, and take care of our planet for the future.',qs:[['What do modern explorers use?',['Ships only','Powerful technology','Animals only','Old maps only'],1],['Where does the UAE’s Hope Probe travel?',['The Moon','Mars','The ocean','A desert'],1],['What do explorers study in space?',['Buildings','Planets, moons, and comets','Schools','Farms'],1],['What do explorers use under the sea?',['Cars','Submarines and robots','Camels','Hot air balloons'],1],['Why do explorers study coral reefs and oceans?',['To find treasure','To protect them','To build cities','To find gold'],1],['What do scientists explore in the deserts of the UAE?',['Plants, animals, and the environment','Buildings','Tall buildings','Only sand'],0],['What does the Hope Probe help scientists do?',['Take photos and collect information','Cook food in space','Fly to the Moon','Fix schools'],0],['Which of these is an example of a modern explorer?',['A farmer','A scientist using a spacecraft','A chef','A teacher'],1],['What is the opposite of “under the sea”?',['In the desert','In the sky','In the sand','In a mountain'],1],['What is the main idea?',['Modern explorers use technology to explore new places and learn','Explorers only travel by ships','Exploration is not important','Explorers only study deserts'],0]]},
{title:'Climbing the Mountains',passage:'Climbing mountains is an exciting and challenging activity. People climb mountains to explore nature, enjoy beautiful views, and test their skills. Before climbing, explorers must plan carefully. They check the weather, bring the right equipment, and make sure they are fit and healthy.\n\nClimbers wear special clothes, strong shoes, and carry a backpack with food, water, and safety tools, such as a map, compass, and flashlight. They also follow safety rules and often climb with a team.\n\nMountain climbing can be difficult because the weather can change quickly. It can be very cold, windy, or even dangerous. However, climbers feel happy and proud when they reach the top. They can see amazing views of the land and feel closer to nature.\n\nIn the UAE, people enjoy climbing mountains such as Jebel Jais, the highest mountain in the country. It is a popular place for outdoor activities and attracts people from around the world.',qs:[['What is mountain climbing?',['A relaxing activity','An exciting and challenging activity','A water sport','A type of food'],1],['Why do people climb mountains?',['To explore nature and enjoy beautiful views','To swim in the sea','To catch fish','To stay at home'],0],['What do climbers check before climbing?',['The weather','The school timetable','The TV schedule','The restaurant menu'],0],['What do climbers carry in their backpacks?',['Food, water, and safety tools','A laptop','Books and pencils','School bags'],0],['Why do climbers follow safety rules?',['To climb faster','To stay safe','To win a competition','To meet new friends'],1],['What can make mountain climbing difficult?',['Hot water','Changing weather and strong wind','Many cars','Too much music'],1],['How do climbers feel when they reach the top?',['Tired and sad','Happy and proud','Angry','Bored'],1],['What can climbers see from the top of a mountain?',['Amazing views of the land','A football stadium','A school building','A shopping mall'],0],['Which mountain is the highest in the UAE?',['Burj Khalifa','Jebel Jais','Jebel Hafeet','Hatta'],1],['What is the main idea?',['Climbing mountains requires planning and preparation','Mountains are always safe','The UAE has no mountains','Climbing is only for children'],0]]},
{title:'Famous Arabic Explorers',passage:'Many Arabic explorers travelled to new places and helped people learn more about the world. These explorers were brave, intelligent, and curious. They explored deserts, seas, and different countries.\n\nIbn Battuta was one of the most famous Arabic explorers. He travelled for more than 20 years and visited many places in Africa, Asia, and Europe. He wrote about the people, cultures, and places he saw. His travels helped people learn about different parts of the world.\n\nIbn Majid was a skilled navigator from the Arabian Gulf. He explored the seas and helped sailors find their way using the stars, maps, and his knowledge of the winds and currents. His work was very important for sea travel and trade.\n\nArabic explorers were important because they shared knowledge, connected different cultures, and helped develop travel and navigation. Their spirit of exploration continues to inspire people today.',qs:[['Who were the Arabic explorers?',['Brave and intelligent people','People who built buildings','People who only stayed at home','People who cooked food'],0],['Where did Arabic explorers travel?',['Only in the UAE','Deserts, seas, and different countries','Only to Africa','Only to Europe'],1],['How long did Ibn Battuta travel?',['5 years','10 years','15 years','More than 20 years'],3],['What did Ibn Battuta write about?',['Food and cooking','People, cultures, and places','Sports and games','His family at home'],1],['Who was Ibn Majid?',['A doctor','A skilled navigator','A teacher','A mountain climber'],1],['How did Ibn Majid help sailors?',['By building new boats','By using stars, maps, and knowledge of winds and currents','By cooking food for them','By teaching them to read'],1],['What was important about Ibn Majid’s work?',['It helped people build houses','It was important for sea travel and trade','It helped people grow food','It was used for sports'],1],['Why were Arabic explorers important?',['They shared knowledge and connected different cultures','They only explored one country','They built modern cities','They stopped people from travelling'],0],['Which continent did Ibn Battuta visit?',['Australia','Africa','North America','Antarctica'],1],['What is the main idea?',['Arabic explorers were brave people who travelled to new places and helped people learn about the world','Arabic explorers only stayed in the UAE','Arabic explorers were not important','Exploring is not important today'],0]]},
{title:'Ibn Khaldun – A Famous Explorer and Scholar',passage:'Ibn Khaldun was a famous Arab explorer, scholar, and historian. He was born in Tunisia in 1332. He travelled to many countries in Africa, Asia, and Europe to learn about people, places, and different cultures.\n\nHe visited cities such as Cairo, Damascus, and Granada. During his travels, he met scholars, studied societies, and learned from different communities. Ibn Khaldun wrote the famous book “Muqaddimah”, in which he explained how societies grow and change.\n\nHis travels helped him understand the lives of people in different parts of the world. He was curious, open-minded, and always wanted to learn. Today, Ibn Khaldun is remembered as one of the greatest Arab thinkers and explorers. His work continues to inspire people to explore, learn about different cultures, and respect others.',qs:[['Who was Ibn Khaldun?',['A farmer','An explorer, scholar, and historian','A sailor','A teacher'],1],['Where was Ibn Khaldun born?',['Egypt','Tunisia','Spain','Iraq'],1],['Which places did Ibn Khaldun visit during his travels?',['Cairo, Damascus, and Granada','Abu Dhabi, Dubai, and Al Ain','London, Paris, and Rome','Tokyo, Beijing, and Seoul'],0],['What did Ibn Khaldun study during his travels?',['Animals and plants','People, societies, and cultures','Sports and games','Buildings only'],1],['What was the name of his famous book?',['The Desert','Muqaddimah','The Map','The Journey'],1],['Which country is Granada in?',['Egypt','Spain','Tunisia','Turkey'],1],['Why did Ibn Khaldun travel to different countries?',['To trade food','To learn about people, places, and cultures','To visit his family','To build roads'],1],['Which word means the same as “open-minded”?',['Angry','Curious','Narrow','Closed'],1],['What is Ibn Khaldun remembered for today?',['A great football player','One of the greatest Arab thinkers and explorers','A famous chef','A builder of buildings'],1],['What is the main idea?',['Ibn Khaldun was a famous Arab thinker and explorer who travelled to learn about the world and his work is important today','Ibn Khaldun only visited Europe','Ibn Khaldun wrote stories for children','Ibn Khaldun never travelled'],0]]}

cabulary:10,Grammar:10,Reading:40}[part];const result={score:Math.round(score/qs.length*weight*100)/100,max:weight,raw:score,total:qs.length,topic:part==='Vocabulary'?'Practice '+(idx+1):(part==='Grammar'?grammar:reading)[idx].title};localStorage.setItem(key('Result',part,'latest'),JSON.stringify(result));}
const writingModels=["Last Friday, I went to the park with my family. The weather was nice and sunny. First, we walked around the park. Then, I played with my sister. We ate sandwiches and drank juice. After that, we took some photos. I saw beautiful flowers and many trees. My favourite part was playing with my family because it was fun. I felt very happy and excited. Finally, we went home in the evening. It was a lovely day. I want to go to the park again soon.", "Last Saturday, I went to an amusement park with my family. I was very excited. First, we bought our tickets. Then, I went on the small roller coaster with my sister. It was fast but fun. After that, we played some games and ate pizza. I liked the bumper cars best because I could play with my brother. We also took many photos. At the end of the day, I felt tired but very happy. It was a wonderful day with my family. I hope we can go again.", "Last weekend, I went to the mountains with my family. We wanted to have an adventure. First, we packed water, food and jackets. Then, we walked up the mountain. The view was beautiful. But the path was hard and the weather was cold. I felt tired and a little scared. We took a short break and stayed together. We walked slowly to stay safe. I liked the fresh air and the view, but I did not like the cold weather. Finally, we went home safely. I felt proud and happy.", "Last Friday, I went to a forest with my family. We wanted to explore a new place. First, we walked between the tall trees. We saw birds and beautiful flowers. Then, it started to rain. The ground was wet, and I felt scared. We stayed together and walked slowly. My father showed us the safe way back. I liked the trees and the fresh air, but I did not like the rain. Finally, we reached our car safely. I felt happy because we had a good adventure together."];
function render(){const tabs=['Vocabulary','Grammar','Reading','Writing','Final Results'];$('tabs').innerHTML=tabs.map(t=>`<button class="${section===t?'active':''}" onclick="section='${t}';index=0;render()">${t}</button>`).join('');let html='';if(section==='Vocabulary'){const definitionQs=vocabDefinitions.map(([word,meaning],i)=>{const other=vocabDefinitions[(i+11)%vocabDefinitions.length][0];const third=vocabDefinitions[(i+23)%vocabDefinitions.length][0];return [`Which word means: ${meaning}?`,[word,other,third],0]});const bank=[...vocabThree,...definitionQs];const originalSets=Array.from({length:4},(_,i)=>bank.slice(i*5,i*5+5));const sets=[...originalSets,...vocabPassages.map(p=>p.qs)];const passage=index>=4?vocabPassages[index-4]:null;html=`<div class="panel"><h2>Vocabulary • 10 marks</h2><p class="muted">Practices 1–4 keep the original questions. Practices 5–13 use exam-style reading passages with five gaps. Choose A, B or C. Unlimited attempts.</p><div class="row">${sets.map((_,i)=>`<button class="${index===i?'active':''}" onclick="index=${i};render()">Practice ${i+1}</button>`).join('')}</div>${passage?`<h3>${escapeHtml(passage.title)}</h3><p class="muted">Read the passage and choose the suitable vocabulary word for each numbered gap.</p><div class="passage">${escapeHtml(passage.text)}</div>`:''}${questions(sets[index],'Vocabulary',index)}<button class="primary" onclick="mark(window.currentQs,'Vocabulary',index)">Check Answers</button><div id="score" class="result" aria-live="polite">Your result will appear here.</div></div>`;window.currentQs=sets[index]}
if(section==='Grammar'||section==='Reading'){const data=section==='Grammar'?grammar:reading;const d=data[index];html=`<div class="panel"><h2>${section} • ${section==='Grammar'?'10':'40'} marks</h2><label>Choose a passage / test: <select onchange="index=Number(this.value);render()">${data.map((x,i)=>`<option value="${i}" ${index===i?'selected':''}>${i+1}. ${escapeHtml(x.title)}</option>`).join('')}</select></label><h3>${escapeHtml(d.title)}</h3><div class="${section==='Reading'?'reading-layout':''}"><div class="passage">${escapeHtml(d.passage)}</div><div>${questions(d.qs,section,index)}<button class="primary" onclick="mark(window.currentQs,'${section}',index)">Submit & Check Answers</button><div id="score" class="result" aria-live="polite">Your result will appear here.</div></div></div></div>`;window.currentQs=d.qs}
if(section==='Final Results'){const parts=['Vocabulary','Grammar','Reading'],weights={Vocabulary:10,Grammar:10,Reading:40};let total=0,complete=true;const rows=parts.map(part=>{let r;try{r=JSON.parse(localStorage.getItem(key('Result',part,'latest'))||'null')}catch(e){}if(!r){complete=false;return `<tr><td>${part}</td><td>Not completed</td><td>— / ${weights[part]}</td></tr>`}total+=r.score;return `<tr><td>${part}</td><td>${escapeHtml(r.topic)}</td><td><strong>${r.score} / ${weights[part]}</strong></td></tr>`}).join('');html=`<div class="panel" id="results-card"><h2>🏆 Grade 6 • Final Revision Results</h2><p><strong>Student ID:</strong> ${escapeHtml($('student').value||'Not entered')} &nbsp; <strong>Class:</strong> ${escapeHtml($('klass').value||'Not entered')}</p><p class="muted">Latest submitted attempt in each section • Unlimited practice attempts</p><table style="width:100%;border-collapse:collapse;text-align:left"><thead><tr><th>Section</th><th>Last completed test</th><th>Marks</th></tr></thead><tbody>${rows}<tr><td>Writing</td><td>Teacher assessment required</td><td>Pending / 40</td></tr></tbody></table><hr><h2>Automatically marked total: ${total.toFixed(2)} / 60</h2><p>${complete?'All three auto-marked sections completed.':'Complete Vocabulary, Grammar and Reading to get all your marks.'}</p><p><strong>Full exam:</strong> ${total.toFixed(2)} / 100 so far, plus writing marks pending (40). This is not a final grade out of 100.</p><p class="muted">Take a screenshot of this page and send it to your teacher. Make sure your student ID and class are visible.</p><button class="primary" onclick="window.print()">Print / Save results</button></div>`;}
if(section==='Writing'){const d=writing[index],draft=localStorage.getItem(key('Writing',index,'draft'))||'';html=`<div class="panel"><h2>Writing • 40 marks</h2><p class="muted">Choose one topic. Write a personal narrative of at least 80 words in complete sentences.</p><label>Writing topic: <select onchange="index=Number(this.value);render()">${writing.map((x,i)=>`<option value="${i}" ${index===i?'selected':''}>${escapeHtml(x.title)}</option>`).join('')}</select></label><h3>${escapeHtml(d.title)}</h3><ol>${d.prompts.map(p=>`<li>${escapeHtml(p)}</li>`).join('')}</ol><p><strong>Plan:</strong> Beginning (where, when, who) → Events and difficulties → Feelings, opinion and ending.</p><p><small>Useful connectors: First • Next • Then • After that • Finally • Because</small></p><div class="question" style="background:#f7f9ff"><button type="button" id="reveal-model" onclick="toggleModel()" aria-expanded="false">👁 Reveal simple example answer</button><div id="model-answer" class="hidden"><h3>Example answer — Read, learn, then write your own story</h3><p style="line-height:1.9;white-space:pre-line">${escapeHtml(writingModels[index])}</p><small>This is a practice example, not a required answer. Try to include all three prompts and write at least 80 words.</small></div></div><textarea id="draft" placeholder="Write your story here..." oninput="saveDraft()">${escapeHtml(draft)}</textarea><div class="row"><strong id="count">0 words</strong><button class="primary" onclick="downloadWriting()">Download my writing (.txt)</button><button onclick="window.print()">Print</button></div><p class="muted">Teacher assessment: Content and prompts 12 • Organisation 8 • Vocabulary and grammar 10 • Spelling 5 • Punctuation and capital letters 5. Writing is not automatically graded.</p></div>`} $('app').innerHTML=html;if(section==='Writing')saveDraft(false)}function toggleModel(){const el=$('model-answer'),btn=$('reveal-model');const show=el.classList.contains('hidden');el.classList.toggle('hidden',!show);btn.textContent=show?'🙈 Hide example answer':'👁 Reveal simple example answer';btn.setAttribute('aria-expanded',String(show))}function saveDraft(save=true){let t=$('draft').value,n=t.trim()?t.trim().split(/\s+/).length:0;$('count').textContent=n+' words'+(n<80?' • Minimum 80 words':' ✓');if(save)localStorage.setItem(key('Writing',index,'draft'),t)}function downloadWriting(){let d=writing[index],text=`Grade 6 Writing: ${d.title}\nStudent: ${$('student').value}\nClass: ${$('klass').value}\n\n${$('draft').value}`,a=document.createElement('a'),blob=new Blob([text],{type:'text/plain'});a.href=URL.createObjectURL(blob);a.download='Grade6_Writing_'+(index+1)+'.txt';a.click();URL.revokeObjectURL(a.href)}$('student').value=localStorage.getItem('g6student')||'';$('klass').value='6/5';$('student').addEventListener('change',e=>{localStorage.setItem('g6student',e.target.value);render()});render();
