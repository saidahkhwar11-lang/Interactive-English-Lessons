<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grade 9 Term 1 Revision</title><style>:root{font-family:system-ui,Arial;color:#182746;background:#f4f7ff}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(110deg,#2446a8,#7b45c4);color:white;padding:30px max(20px,calc((100vw - 1100px)/2))}h1{margin:0 0 8px}main{max-width:1100px;margin:25px auto;padding:0 16px}.tabs{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:20px}button{cursor:pointer;border:0;border-radius:10px;padding:12px 17px;font-weight:700;background:#e3e9fa;color:#223b75}button.active,button.primary{background:#284db1;color:white}.panel{background:white;border-radius:16px;padding:24px;box-shadow:0 4px 20px #24305b12;margin-bottom:18px}.muted{color:#5b6982}.question{border:1px solid #dce3f3;border-radius:12px;padding:16px;margin:13px 0}.question label{display:block;padding:9px;margin:6px 0;border:1px solid #e2e7f3;border-radius:8px;cursor:pointer}.question label:has(input:checked){background:#e5eeff;border-color:#5276ce}.question input{margin-right:8px}.passage{background:#f2f6ff;border-left:4px solid #5374d8;padding:18px;line-height:1.85;border-radius:9px;white-space:pre-line}.result{padding:14px;background:#e8f5ee;border-radius:9px;margin-top:15px}textarea{width:100%;min-height:320px;border:1px solid #bbc8e4;border-radius:10px;padding:16px;font:16px/1.8 system-ui}select,input[type=text]{padding:11px;border:1px solid #bfcbe4;border-radius:8px;max-width:100%}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.hidden{display:none}small{color:#586782}.feedback{font-weight:600;margin-top:7px}.correct{color:#08764c}.wrong{color:#b43c48}@media(min-width:850px){.reading-layout{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}.reading-layout .passage{position:sticky;top:12px;max-height:78vh;overflow:auto}}table th,table td{padding:12px 8px;border-bottom:1px solid #dce3f3}@media print{header,.tabs,button{display:none!important}body{background:white}.panel{box-shadow:none}} </style></head><body><header><h1>Grade 9 • English EOT Exam Portal</h1><div>Term 1 | Vocabulary • Grammar • Reading • Writing</div></header><main><nav class="tabs" id="tabs"></nav><div id="content"></div></main><footer>Independent revision practice. Your progress is saved on this device, not submitted to your teacher.</footer><script>
const REGISTERED={"9/4":["abcf1a33300a4621796b","9b0cfc83ac55d4e50a72","aeb3da672ec036597a7c","5cb0b92a74cdff352c27","5d55b1dddcfab9b45069","777370df012e5b0b0bd9","72657a81e476044179f2","a293745a357e53cbbb11","dbe5448be0c810289f4b","bbba2fa0e2fd679ffab4","f92ba03a0db37abe9a18","a8de1b5f22a73da88641","af31e8fa4ab00ea13468","0900ef8611b2b518cf5e","7e862602bf7576341533","bb38783d6f7e40246bff","adf635837aced0cc99fe","a69a15fff1e2d231e940","c57e896ddc48649d5f85","1295a499ccfbc4f18513","52726f12f19a85f8b2ec","6e85f044876472733806","e1490d835a4e740cc60c","6c459c56a6785bfc7c7d","6c8ce043d6194895d67b","e0ab9d262818d7ed5398"],"9/5":["154d4289de02332b93e9","2b6bcecd6ca3fb52e494","02413cfc732dfcb8d02d","3260a13c5455611fff89","f99fb0dccfba4749c6e4","fa9a6fd902de132190df","f90c77065874883153e8","8c919c75c0b14f6c14cb","d31dc5b758326a79bcde","d9b569adbde6bd17cad6","1640a24837e9e0a07f7c","20ce7caf5cd377f42026","df1f712ddfa15101a479","513b6b910fa27e8a5763","23da892769e1511119c0","e30b1dd27383855bf68a","ea2833e35f3e94463f10","56a48efe4d0b20166a10","811362818daf018b884e","d99f26ae69a061125070","d120a58571ce1dff1289","1d960223400c194de37f","1527b3df91af29abdd31"]};let verified=!!sessionStorage.getItem('g9verified');async function validateStudent(){let id=document.getElementById('sid').value.trim();if(!/^[0-9]{5,12}$/.test(id)){alert('Enter your valid student ID.');return;}let bytes=new TextEncoder().encode('g9term1:'+id);let hash=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes))).map(b=>b.toString(16).padStart(2,'0')).join('').slice(0,20);let found=Object.entries(REGISTERED).find(([cl,ids])=>ids.includes(hash));if(!found){alert('Student ID not found in Grade 9/4 or 9/5. Please check your ID or contact your teacher.');return;}localStorage.setItem('g9sid',id);localStorage.setItem('g9cls',found[0]);sessionStorage.setItem('g9verified','yes');verified=true;show('Vocabulary');}function logout(){sessionStorage.removeItem('g9verified');verified=false;show('Vocabulary');}
let practiceIndex=0;function practiceButtons(type){let names=type==='Vocabulary'?['Practice 1','Practice 2','Practice 3']:['Grammar Practice 1','Grammar Practice 2','Grammar Practice 3'];return '<div class="row" style="margin:14px 0">'+names.map((t,i)=>'<button class="'+(practiceIndex===i?'active':'')+'" onclick="practiceIndex='+i+';show(\''+type+'\')">'+t+'</button>').join('')+'</div>'}function selectedPractice(type){if(practiceIndex===0)return quiz(type);return extraQuiz(type+' Test '+(practiceIndex+1))}
const WORD_MEANINGS=[['urban','relating to a city'],['residential','where people live'],['commercial','related to shops and business'],['industrial','related to factories'],['convenient','easy and useful'],['comfortable','pleasant and relaxing'],['route','the way to travel'],['destination','the place you are going to'],['professor','a university teacher'],['tutor','someone who helps students learn'],['facilities','buildings and equipment'],['services','help provided by an organisation'],['browse','look around without necessarily buying'],['search','look carefully for something'],['exchange','replace a purchased item with another'],['refund','money returned to a customer'],['receipt','proof of purchase'],['credit card','a card used for payment'],['profit','money earned after costs'],['fee','payment for a service'],['brand','name identifying a product company'],['quality','how good something is'],['survey','questions collecting opinions'],['prediction','a statement about the future']];
const VOCAB_SETS=Array.from({length:13},(_,set)=>Array.from({length:5},(_,i)=>{let n=(set*5+i)%WORD_MEANINGS.length,w=WORD_MEANINGS[n],a=WORD_MEANINGS[(n+7)%24][0],b=WORD_MEANINGS[(n+13)%24][0],opts=[w[0],a,b],shift=(set+i)%3;opts=opts.slice(shift).concat(opts.slice(0,shift));return ['Which word means: '+w[1]+'?',opts,opts.indexOf(w[0])]}));
let currentSet='';function vocabSets(){return '<section class="panel"><h2>Vocabulary • 10 marks</h2><p class="muted">Choose a separate practice set. Five questions per set, unlimited attempts.</p><div class="row">'+VOCAB_SETS.map((_,i)=>'<button class="'+(practiceIndex===i?'active':'')+'" onclick="practiceIndex='+i+';show(\'Vocabulary\')">Practice '+(i+1)+'</button>').join('')+'</div>'+VOCAB_SETS[practiceIndex].map((q,i)=>'<div class="question"><b>'+(i+1)+'. '+q[0]+'</b>'+q[1].map((o,j)=>'<label><input type="radio" name="voc'+i+'" value="'+j+'"> '+['A','B','C'][j]+'. '+o+'</label>').join('')+'</div>').join('')+'<button class="primary" onclick="markVocab()">Check Answers</button><div class="result" id="vscore">Your result will appear here.</div></section>'}
function markVocab(){let score=0;VOCAB_SETS[practiceIndex].forEach((q,i)=>{let a=document.querySelector('input[name="voc'+i+'"]:checked');if(a&&Number(a.value)===q[2])score+=2});let marks=JSON.parse(localStorage.getItem('g9vocabResults')||'{}');marks[practiceIndex]=score;localStorage.setItem('g9vocabResults',JSON.stringify(marks));document.getElementById('vscore').textContent='Your score: '+score+' / 10 marks';}

const EXTRA=[["Vocabulary Test 2","The shop gave me my money back as a ____.",["refund","route","survey"],0],["Vocabulary Test 2","Please keep the ____ as proof of purchase.",["professor","receipt","destination"],1],["Vocabulary Test 2","A ____ is money paid for a service.",["fee","brand","prediction"],0],["Vocabulary Test 2","The ____ of this bag is excellent.",["survey","quality","route"],1],["Vocabulary Test 2","A ____ is the name of a company's products.",["brand","tutor","facility"],0],["Vocabulary Test 3","A university teacher is a ____.",["professor","customer","receipt"],0],["Vocabulary Test 3","The place you are travelling to is your ____.",["route","destination","fee"],1],["Vocabulary Test 3","A ____ helps students with difficult work.",["brand","tutor","profit"],1],["Vocabulary Test 3","A ____ collects people's opinions.",["survey","refund","service"],0],["Vocabulary Test 3","A ____ is a statement about what may happen.",["prediction","receipt","exchange"],0],["Grammar Test 2","She enjoys ____ at the mall.",["shop","shopping","to shop"],1],["Grammar Test 2","We ____ visit the museum tomorrow.",["are going to","going","is going to"],0],["Grammar Test 2","The jacket was damaged, ____ I asked for a refund.",["but","or","so"],2],["Grammar Test 2","Do you know where the bus station ____?",["is","does","are"],0],["Grammar Test 2","My brother is interested ____ engineering.",["on","in","at"],1],["Grammar Test 3","You should ____ your receipt.",["to keep","keeping","keep"],2],["Grammar Test 3","____, turn left at the traffic lights. Then go straight.",["However","First","Therefore"],1],["Grammar Test 3","The hotel is ____ the bank, across the street.",["opposite","between","inside"],0],["Grammar Test 3","Could you tell me what time the shop ____?",["open","opens","does open"],1],["Grammar Test 3","We waited ____ the bus for twenty minutes.",["to","at","for"],2]];const EXTRATESTS=['Vocabulary Test 2','Vocabulary Test 3','Grammar Test 2','Grammar Test 3'];function extraQuiz(cat){let arr=EXTRA.map((q,i)=>({...q,id:'extra'+i})).filter(q=>q[0]===cat);return '<section><h2>'+cat+' · 10 marks</h2>'+arr.map(q=>'<div class="question"><b>'+q[1]+'</b>'+q[2].map((o,j)=>'<label class="choice"><input type="radio" name="'+q.id+'" '+(answers[q.id]===j?'checked':'')+' onchange="answers[\''+q.id+'\']='+j+';save()"> '+['A','B','C'][j]+'. '+o+'</label>').join('')+'<p id="f'+q.id+'"></p></div>').join('')+'<button class="primary" onclick="gradeExtra(\''+cat+'\')">Check answers</button><h3 id="score'+cat.replace(/ /g,'')+'"></h3></section>'}function gradeExtra(cat){let list=EXTRA.map((q,i)=>({...q,id:'extra'+i})).filter(q=>q[0]===cat),points=0;list.forEach(q=>{if(answers[q.id]===q[3])points+=2;let f=document.getElementById('f'+q.id);f.textContent=answers[q.id]===q[3]?'✓ Correct':'Correct: '+q[2][q[3]];f.className=answers[q.id]===q[3]?'correct':'wrong'});let scores=JSON.parse(localStorage.getItem('g9scores')||'{}');scores[cat]=points;localStorage.setItem('g9scores',JSON.stringify(scores));document.getElementById('score'+cat.replace(/ /g,'')).textContent='Score: '+points+'/10'}function resultsPage(){let scores=JSON.parse(localStorage.getItem('g9scores')||'{}');return '<section><h2>My Revision Results</h2>'+Object.entries(JSON.parse(localStorage.getItem('g9vocabResults')||'{}')).map(([i,mark])=>'<div class="question">Vocabulary Practice '+(Number(i)+1)+': '+mark+'/10</div>').join('')+<p>Student ID: '+(localStorage.getItem('g9sid')||'Not entered')+' · Class: '+(localStorage.getItem('g9cls')||'')+'</p>'+EXTRATESTS.map(t=>'<div class="question">'+t+': <b>'+(scores[t]===undefined?'Not completed':scores[t]+'/10')+'</b></div>').join('')+'<p>Scores are stored on this device and are not automatically submitted to your teacher.</p><button class="primary" onclick="window.print()">Print / Save Results</button></section>'}
const Q=[["Vocabulary","A quiet area with houses is ____.",["industrial","residential","commercial"],1],["Vocabulary","A bus stop outside your home is very ____.",["crowded","convenient","urban"],1],["Vocabulary","To look around shops without buying is to ____.",["browse","refund","exchange"],0],["Vocabulary","The way a bus travels is its ____.",["destination","route","receipt"],1],["Vocabulary","A college library and sports hall are ____.",["facilities","fees","brands"],0],["Grammar","You ____ visit us next weekend.",["are going to","going to","are go to"],0],["Grammar","The building is ____ the shopping mall, on the other side of the road.",["between","opposite","among"],1],["Grammar","Could you tell me ____?",["what time will you arrive","what time you will arrive","what time do you arrive"],1],["Grammar","The neighbourhood is peaceful, ____ traffic is heavy on Fridays.",["but","or","so"],0],["Grammar","I enjoy ____ here.",["to live","live","living"],2],["Reading 3A","How much did Sara pay for her trainers?",["300 dirhams","350 dirhams","530 dirhams"],1],["Reading 3A","How long did Sara save?",["one month","two months","three months"],2],["Reading 3A","How long was the return period?",["five days","two weeks","30 days"],2],["Reading 3A","Where was the service desk?",["ground floor near entrance","first floor","back of the shop"],0],["Reading 3A","What was wrong with the trainers?",["wrong size","sole was coming off","wrong colour"],1],["Reading 3A","Why did Sara request a refund?",["sale purchase","assistant insisted","found cheaper trainers online"],2],["Reading 3A","Faulty means ____.",["expensive","not working properly","brand new"],1],["Reading 3A","The text mainly explains ____.",["Sara's return and what she learned","the best shop","choosing trainers"],0],["Reading 3B","At college, students must ____.",["manage their own time","attend shorter classes","avoid exams"],0],["Reading 3B","Successful students ____ large assignments.",["give away","divide into smaller tasks","leave until last night"],1],["Reading 3B","The writing centre provides ____.",["job advice","sleeping rooms","tutor support"],2],["Reading 3B","Clubs are especially helpful for ____.",["students living far from home","part-time workers","athletes only"],0],["Reading 3B","Isolated means ____.",["busy","alone and disconnected","hungry"],1],["Reading 3B","Maintaining means ____.",["keeping","losing","measuring"],0],["Reading 3B","Ali leaves essays until 2 a.m. What helps?",["career office","sports club","planner and earlier start"],2],["Reading 3B","The text explains ____.",["college vs school","habits for college success","one college's services"],1]],V=[["urban","حضري"],["residential","سكني"],["commercial","تجاري"],["industrial","صناعي"],["convenient","مناسب"],["comfortable","مريح"],["route","مسار"],["destination","وجهة"],["professor","أستاذ جامعي"],["tutor","مدرس خصوصي"],["facilities","مرافق"],["services","خدمات"],["browse","يتصفح"],["search","يبحث"],["exchange","يستبدل"],["refund","استرداد المال"],["receipt","إيصال"],["credit card","بطاقة ائتمان"],["profit","ربح"],["fee","رسوم"],["brand","علامة تجارية"],["quality","جودة"],["survey","استطلاع"],["prediction","توقع"]],R=[["Verb patterns","want / decide / plan + to + verb; enjoy / avoid / finish + -ing; can / should / let + base verb."],["Going to","am / is / are + going to + base verb, for plans and evidence-based predictions."],["Conjunctions","and = addition; but = contrast; or = choice; so = result."],["Adverbial linkers","However = contrast; In addition = extra information; Therefore = result; First / Then / Finally = sequence."],["Indirect questions","Could you tell me where the hotel is? Use statement word order."],["Prepositions of place","in a city; on a floor or street; at a bus stop; between two places; next to; opposite."],["Dependent prepositions","interested in; famous for; good at; wait for; look for; listen to; arrive in a city / at a building."]];
const tabs=['Vocabulary','Grammar','Reading 3A','Reading 3B','Writing','Practice Exam','Final Results'];let current='Vocabulary';let answers=JSON.parse(localStorage.getItem('g9revisionanswers')||'{}');const save=()=>localStorage.setItem('g9revisionanswers',JSON.stringify(answers));
function show(tab){if(current!==tab)practiceIndex=0;current=tab;document.getElementById('tabs').innerHTML=tabs.map(t=>'<button class="'+(t===tab?'active':'')+'" onclick="show('+JSON.stringify(t).replace(/"/g,"&quot;")+')">'+t+'</button>').join('');let h='';
if(tab==='Home')h=verified?'<section><h2>Welcome, Grade 9 student!</h2><p>Student ID recognised · Class '+localStorage.getItem('g9cls')+'</p><p>Study the lessons and collect practice marks. Your progress is stored on this device.</p><button onclick="logout()">Sign out</button></section>':'<section><h2>Student Login</h2><p>Enter your school Student ID. The page will recognise registered students from classes 9/4 and 9/5 automatically.</p><p><input id="sid" inputmode="numeric" autocomplete="off" placeholder="Student ID"> <button class="primary" onclick="validateStudent()">Join Revision</button></p><p class="muted">Your name and full student ID list are not displayed publicly. Your marks remain on this device.</p></section>';
if(tab==='Vocabulary')h='<section><h2>Vocabulary · 24 Target Words</h2><p>Choose one of 13 separate vocabulary practices. Each has five questions and is worth 10 marks.</p><div class="words">'+V.map(([w,a])=>'<div class="word"><b>'+w+'</b><p dir="rtl">'+a+'</p></div>').join('')+'</div><p><b>Extra city words:</b> apartment, block, bus station, business area, car park, central, directions, hotel, neighbourhood, peaceful, shopping mall, street map, suburban, traffic, traffic lights, transportation.</p></section>'+vocabSets();
if(tab==='Grammar')h='<section><h2>Seven Grammar Rules</h2>'+R.map(([a,b],i)=>'<div class="question"><h3>Rule '+(i+1)+': '+a+'</h3><p>'+b+'</p></div>').join('')+'</section>'+practiceButtons('Grammar')+selectedPractice('Grammar');
if(tab==='Reading 3A')h='<section><h2>Reading 3A · Returns and Refunds (24 marks)</h2><div class="passage">Taking Something Back\n\nSara saved for three months to buy trainers for 350 dirhams at Speedy Sports. After wearing them twice, she noticed the sole of one shoe was coming off. The shop policy allowed returns within 30 days with the original receipt. Faulty items could be exchanged or refunded, while sale items could only be exchanged.\n\nSara visited the customer service desk on the ground floor near the main entrance. Khalid checked the trainers and apologised. Sara chose a refund because she found the same trainers for less money online. The money would return to her mother’s credit card within five working days. Sara learned to keep receipts and check product quality.</div></section>'+quiz('Reading 3A');
if(tab==='Reading 3B')h='<section><h2>Reading 3B · Success in College (16 marks)</h2><div class="passage">Succeeding in Your First Year at College\n\nCollege students must manage their own time. Successful students use a planner, divide large assignments into smaller tasks and start early. They use campus facilities such as libraries, writing centres and tutors. Clubs and study groups help students, especially those living far from home, feel less isolated. Visiting professors during office hours is useful. Getting enough sleep, eating well and exercising also support learning. Success depends on organisation, available support and maintaining a healthy balance between work and rest.</div></section>'+quiz('Reading 3B');
if(tab==='Writing')h='<section><h2>Writing · 40 marks</h2><h3>Task 1.1 · 15 marks</h3><p>Read an email and summarise the main ideas in <b>2–3 sentences</b>, using your own words. Include no personal opinion.</p><h3>Task 1.2 · 25 marks</h3><p>Reply in <b>at least 130 words</b>. Include greeting, opening, three developed prompt paragraphs, closing and sign-off.</p><div class="passage">From: Huda · Subject: My first month at college!\n\nHi Noor,\nMy first month at college has been busy. The campus is huge, with libraries, a gym and a cinema. My classes are interesting but difficult, and I record lectures to review them. I joined a photography club and made friends. Transport is my biggest problem because I live far away and take two buses every morning. I am thinking about buying a bike. How is your school year? What do you want to study after Grade 12?\nLove, Huda</div><p><b>1.1</b> Summarise Huda’s main ideas in your notebook.</p><p><b>1.2</b> Reply to Huda: (1) describe your school year and journey to school; (2) describe a club or activity you enjoy and why; (3) say what and where you want to study after Grade 12, with reasons.</p><p><b>Useful phrases:</b> Thanks for your email. · At first, I felt… · In my opinion… because… · However,… · Write back soon!</p><label><input type="checkbox"> I answered all three prompts and checked spelling, paragraphs and word count.</label></section>';
if(tab==='Final Results')h=resultsPage();
if(tab==='Practice Exam')h='<section><h2>Practice Exam · 60 marks</h2><p>26 questions: Vocabulary 10, Grammar 10, Reading 3A 24 and Reading 3B 16. Writing is completed separately on paper.</p></section>'+quiz('ALL');
document.getElementById('content').innerHTML=h;window.scrollTo(0,0)}
function quiz(cat){let list=Q.map((q,i)=>({...q,id:i})).filter(q=>cat==='ALL'||q[0]===cat);return '<section><h2>Exam-style Questions</h2>'+list.map(q=>'<div class="question"><b>'+(q.id+1)+'. '+q[1]+'</b>'+q[2].map((v,j)=>'<label class="choice"><input type="radio" name="q'+q.id+'" '+(answers[q.id]===j?'checked':'')+' onchange="answers['+q.id+']='+j+';save()"> '+['A','B','C'][j]+'. '+v+'</label>').join('')+'<p id="f'+q.id+'"></p></div>').join('')+'<button class="primary" onclick="grade('+JSON.stringify(cat)+')">Check my answers</button><h3 id="score"></h3></section>'}
function grade(cat){let list=Q.map((q,i)=>({...q,id:i})).filter(q=>cat==='ALL'||q[0]===cat),score=0,max=0;list.forEach(q=>{let pts=q[0]==='Reading 3A'?3:2;max+=pts;if(answers[q.id]===q[3])score+=pts;let el=document.getElementById('f'+q.id);el.className=answers[q.id]===q[3]?'correct':'wrong';el.textContent=answers[q.id]===q[3]?'✓ Correct':'Correct answer: '+['A','B','C'][q[3]]+' — '+q[2][q[3]]});document.getElementById('score').textContent='Your score: '+score+' / '+max+' marks';}
show('Vocabulary');
