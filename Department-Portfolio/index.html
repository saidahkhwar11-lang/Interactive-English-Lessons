<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>English Department Digital Portfolio</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#f4f5f3}iframe{border:0;width:100%;height:100vh;display:block}</style></head><body><iframe id="app" src="base.html"></iframe><script>
app.addEventListener('load',()=>{
const w=app.contentWindow,d=app.contentDocument;
const css=d.createElement('style');css.textContent=`
:root{--navy:#4f626d!important;--teal:#789b96!important;--gold:#cdbb91!important;--bg:#f4f5f3!important;--card:#fbfbfa!important;--line:#dfe4e3!important;--muted:#7b878c!important;--green:#7da08c!important;--red:#bd8680!important}
body{background:#f4f5f3!important;color:#3f515a!important}
.hero{background:linear-gradient(135deg,#dfe8e6,#e7ece8 58%,#eee9df)!important;color:#3f535d!important;border-bottom:1px solid #d5dfdc!important;padding:28px 6vw 24px!important}
.hero h1{color:#405761!important}.hero p{color:#718087!important}.hero small{color:#718087!important;opacity:1!important}
.starbar{background:#e7e2d8!important;color:#655f53!important;border-bottom:1px solid #d8cfbb!important}.startrack{font-weight:700!important;padding:8px 0!important}
.nav button{background:#f8f9f8!important;color:#66777f!important;border:1px solid #d7dfdd!important}.nav button.active{background:#d9e4df!important;color:#536d68!important;border-color:#c7d7d1!important}
.wrap{background:transparent!important}.sectionhead h2{color:#4d626c!important}.sectionhead p{color:#7f8a8f!important}.sectionhead>b{color:#6c7d84!important}
.card,.teacher,.sharecard,.mini,.item,.day{background:#fbfbfa!important;border-color:#dfe4e3!important;box-shadow:0 4px 14px rgba(70,86,91,.04)!important}
.card h3,.sharecard h3,.teacher b{color:#465b65!important}.card p,.sharecard p,.teacher small{color:#7c888d!important}
.btn{background:#e8ecec!important;color:#536971!important;border:1px solid #dde3e2!important;box-shadow:none!important}.btn.primary{background:#789b96!important;color:#fff!important;border-color:#789b96!important}.btn.gold{background:#d9ccb0!important;color:#5f584a!important;border-color:#d0c19e!important}.btn.danger{background:#efe2e0!important;color:#96625d!important;border-color:#e4d2cf!important}
.progress{background:#e5e9e8!important;height:8px!important}.bar{background:#91ada7!important}.low .bar{background:#c8aba0!important}.done .bar{background:#86a994!important}
.notice{background:#f2eee4!important;border-color:#ddd3bd!important;color:#676156!important}.dow{background:#e8efed!important;color:#637b78!important;border-color:#d8e3e0!important}.event{background:#edf3f1!important;border-left-color:#8aa9a4!important;color:#5e7472!important}
.modal{background:rgba(61,73,79,.34)!important}.box{background:#fbfbfa!important;border:1px solid #e1e5e4!important;box-shadow:0 18px 46px rgba(60,70,76,.14)!important}input,textarea,select{background:#f8f9f8!important;border-color:#d9e0df!important;color:#475b64!important}
.lesson-compact>p,.lesson-compact>.actions,.lesson-compact>.notice{display:none!important}.lesson-compact{padding:16px!important}
.teacher-grid{display:grid!important;grid-template-columns:1fr!important;gap:8px!important;margin-top:10px!important}
.teacher-list-row{display:grid!important;grid-template-columns:minmax(190px,1.2fr) minmax(220px,2.5fr) 58px auto!important;gap:14px!important;align-items:center!important;padding:11px 14px!important;border:1px solid #dfe4e3!important;border-radius:12px!important;background:#fbfbfa!important}
.teacher-list-row .name{font-weight:800;color:#465b65}.teacher-list-row .pct{font-weight:800;text-align:right;color:#60737b}.teacher-list-row .progress{margin:0!important}.teacher-list-row .btn{padding:7px 11px!important;font-size:13px!important}
@media(max-width:720px){.teacher-list-row{grid-template-columns:1fr auto!important}.teacher-list-row .progress{grid-column:1/-1}.teacher-list-row .details{grid-column:1/-1;justify-self:start}}
`;d.head.appendChild(css);
const s=d.createElement('script');s.textContent=`
function lessonRows(i){let t=state.teachers[i],rows=[];Object.entries(t.plans||{}).forEach(([k,arr])=>{if(k.startsWith(state.term+'-'))(arr||[]).forEach((p,j)=>rows.push({p,key:k,index:j,week:(k.split('-W')[1]||'')}))});return rows.sort((a,b)=>String(b.p.date||'').localeCompare(String(a.p.date||'')))}
function openFolder(i){let t=state.teachers[i],rows=lessonRows(i);let k=weekKey(),count=(t.plans[k]||[]).length;let html=\`<h2>📁 \\${esc(t.name)} · \\${esc(state.term)}</h2><div class="actions"><button class="btn primary" onclick="uploadPlan(\\${i})">+ Upload Plan</button>\\${count>=4?\`<button class="btn gold" onclick="certificate(\\${i})">Certificate</button>\`:''}</div>\`;if(!rows.length){html+='<p>No lesson plans uploaded for this term.</p>'}else{html+=\`<div class="list">\\${rows.map(r=>{let p=r.p;let fileBtns=p.data?\`<a class="btn primary" href="\\${p.data}" target="_blank">Open</a><a class="btn" href="\\${p.data}" download="\\${esc(p.file||'lesson-plan')}">Download</a>\`:'';return \`<div class="item"><b>\\${esc(p.file||'Lesson plan')}</b><small>\\${esc(p.grade||'Grade not specified')} · Week \\${esc(r.week)}</small><div class="actions">\\${fileBtns}<button class="btn gold" onclick="editPlan(\\${i},'\\${r.key}',\\${r.index})">Edit</button><button class="btn" onclick="replacePlan(\\${i},'\\${r.key}',\\${r.index})">Replace File</button><button class="btn danger" onclick="deletePlan(\\${i},'\\${r.key}',\\${r.index})">Delete</button></div></div>\`}).join('')}</div>\`}html+='<div class="actions"><button class="btn" onclick="closeModal()">Close</button></div>';openModal(html)}
function editPlan(i,k,j){let p=state.teachers[i].plans[k][j];openModal(\`<h2>Edit Lesson Plan</h2><label>Grade / class</label><input id="editGrade" value="\\${esc(p.grade||'')}"><div class="actions"><button class="btn primary" onclick="savePlanEdit(\\${i},'\\${k}',\\${j})">Save Changes</button><button class="btn" onclick="openFolder(\\${i})">Cancel</button></div>\`)}
function savePlanEdit(i,k,j){state.teachers[i].plans[k][j].grade=editGrade.value.trim();save();openFolder(i)}
function replacePlan(i,k,j){let p=state.teachers[i].plans[k][j];openModal(\`<h2>Replace Lesson Plan File</h2><p>\\${esc(p.file||'Current file')}</p><label>Choose replacement file</label><input id="replaceFile" type="file" accept=".pdf,.doc,.docx,.ppt,.pptx"><div class="actions"><button class="btn primary" onclick="savePlanReplacement(\\${i},'\\${k}',\\${j})">Replace File</button><button class="btn" onclick="openFolder(\\${i})">Cancel</button></div>\`)}
function savePlanReplacement(i,k,j){let file=replaceFile.files[0];if(!file)return alert('Choose a replacement file.');let p=state.teachers[i].plans[k][j],r=new FileReader();r.onload=()=>{p.file=file.name;p.data=r.result;p.date=new Date().toISOString();save();openFolder(i)};r.readAsDataURL(file)}
function deletePlan(i,k,j){if(!confirm('Delete this lesson plan?'))return;state.teachers[i].plans[k].splice(j,1);save();openFolder(i)}
function renderTeachers(){let k=weekKey(),out='';state.teachers.forEach((t,i)=>{let c=(t.plans[k]||[]).length,p=Math.min(100,c/4*100),cls=c>=4?'done':'low';out+=\`<div class="teacher-list-row \\${cls}"><div class="name">📁 \\${esc(t.name)}</div><div class="progress"><div class="bar" style="width:\\${p}%"></div></div><div class="pct">\\${Math.round(p)}%</div><button class="btn details" onclick="openFolder(\\${i})">Details</button></div>\`});teacherGrid.innerHTML=out||'<p>No teacher folders yet.</p>';let stars=state.teachers.filter(t=>(t.plans[k]||[]).length>=4).map(t=>t.name);starTrack.textContent=stars.length?'⭐ Star Teachers of the Week: '+stars.join(' ⭐ '):'⭐ Star Teachers of the Week: Teachers who upload at least 4 lesson plans this week will appear here automatically.'}
(function(){let cards=[...document.querySelectorAll('.card')],card=cards.find(x=>x.querySelector('h3')&&x.querySelector('h3').textContent.includes('Lesson Plans'));if(card)card.classList.add('lesson-compact');renderTeachers()})();
`;d.body.appendChild(s);
});
</script></body></html>
