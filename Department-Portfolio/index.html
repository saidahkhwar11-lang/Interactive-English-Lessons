<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>English Department Digital Portfolio</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#f8fafc}iframe{border:0;width:100%;height:100vh;display:block}</style></head><body><iframe id="shell" src="app-old.html"></iframe><script>
const softTheme=`
:root{--navy:#52687a!important;--teal:#78aaa8!important;--gold:#efd59a!important;--bg:#f8fafc!important;--card:#fff!important;--line:#e3e8ec!important;--muted:#7a8994!important;--green:#78ad91!important;--red:#d89090!important}
body{background:linear-gradient(180deg,#fbfcfd 0%,#f5f8fa 100%)!important;color:#34495a!important}
.hero{background:linear-gradient(135deg,#e9f2f4 0%,#e8f4f0 48%,#f7f1e6 100%)!important;color:#344f61!important;border-bottom:1px solid #dce8e8!important;box-shadow:none!important}
.hero small{color:#6f8993!important;opacity:1!important}.hero p{color:#71838e!important}.hero h1{color:#35586a!important}
.starbar{background:#f6f0df!important;color:#6c6048!important;border-bottom:1px solid #eadbb5!important}.startrack{font-weight:700!important}
.nav button{background:#fff!important;color:#607885!important;border:1px solid #dce6e8!important;box-shadow:0 2px 8px rgba(75,100,115,.05)!important}.nav button.active{background:#f3dfaa!important;color:#5e5541!important;border-color:#ecd18c!important}
.wrap{background:transparent!important}.sectionhead h2{color:#435d6c!important}.sectionhead>b{color:#6c818d!important}
.card,.teacher,.sharecard,.mini,.item,.day{background:rgba(255,255,255,.94)!important;border-color:#e3e9ed!important;box-shadow:0 5px 18px rgba(70,95,110,.045)!important}
.card h3,.teacher b,.sharecard h3{color:#3f5969!important}.card p,.teacher small,.sharecard p{color:#7b8993!important}
.btn{background:#eef3f5!important;color:#536d7b!important;border:1px solid #e4eaed!important;box-shadow:none!important}.btn.primary{background:#dcefed!important;color:#426d6c!important;border-color:#cce5e2!important}.btn.gold{background:#f7e9bd!important;color:#675d45!important;border-color:#f0dda4!important}.btn.danger{background:#faeded!important;color:#a05e5e!important;border-color:#f4dede!important}
.progress{background:#edf1f3!important}.bar{background:#9fc8c1!important}.low .bar{background:#e4b8a9!important}.done .bar{background:#8fc3a6!important}
.notice{background:#fff9e9!important;border-color:#f0e0b4!important;color:#6e6553!important}.dow{background:#edf5f4!important;color:#607d7c!important;border-color:#dce9e7!important}.event{background:#edf7f5!important;border-left-color:#9bc8c1!important;color:#5b7475!important}
.modal{background:rgba(72,91,104,.32)!important}.box{box-shadow:0 18px 50px rgba(64,80,92,.14)!important;border:1px solid #e6eaed!important}input,textarea,select{border-color:#dfe6ea!important;background:#fbfcfd!important;color:#405866!important}
`;
function applyTheme(){try{const outer=shell.contentDocument,inner=outer&&outer.getElementById('app');const d=inner&&inner.contentDocument;if(!d||!d.head)return;let st=d.getElementById('softElegantTheme');if(!st){st=d.createElement('style');st.id='softElegantTheme';st.textContent=softTheme;d.head.appendChild(st)}}catch(e){}}
shell.addEventListener('load',()=>{applyTheme();setTimeout(applyTheme,300);setTimeout(applyTheme,900)});setInterval(applyTheme,1500);
</script></body></html>
