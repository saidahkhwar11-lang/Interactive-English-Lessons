<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>English Department Digital Portfolio</title><style>html,body{margin:0;height:100%;overflow:hidden}iframe{border:0;width:100%;height:100vh;display:block}</style></head><body><iframe id="app" src="base.html"></iframe><script>
app.addEventListener('load',()=>{
const w=app.contentWindow,d=app.contentDocument;
const css=d.createElement('style');css.textContent=`
.teacher{cursor:pointer;transition:.18s ease;padding:13px 15px}.teacher:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(65,92,102,.10)}
.teacher .row{margin-bottom:10px}.teacher .progress{margin:0!important;height:9px}.teacher .actions,.teacher>small{display:none!important}
.lesson-compact>p,.lesson-compact>.actions,.lesson-compact>.notice{display:none!important}.lesson-compact{padding-bottom:18px}
`;d.head.appendChild(css);
const s=d.createElement('script');s.textContent=`
function lessonRows(i){let t=state.teachers[i],rows=[];Object.entries(t.plans||{}).forEach(([k,arr])=>{if(k.startsWith(state.term+'-'))(arr||[]).forEach((p,j)=>rows.push({p,key:k,index:j,week:(k.split('-W')[1]||'')}))});return rows.sort((a,b)=>String(b.p.date||'').localeCompare(String(a.p.date||'')))}
function openFolder(i){let t=state.teachers[i],rows=lessonRows(i);let k=weekKey(),count=(t.plans[k]||[]).length;let html=\`<h2>📁 \\${esc(t.name)} · \\${esc(state.term)}</h2><div class="actions"><button class="btn primary" onclick="uploadPlan(\\${i})">+ Upload Plan</button>\\${count>=4?\`<button class="btn gold" onclick="certificate(\\${i})">Certificate</button>\`:''}</div>\`;if(!rows.length){html+='<p>No lesson plans uploaded for this term.</p>'}else{html+=\`<div class="list">\\${rows.map(r=>{let p=r.p;let fileBtns=p.data?\`<a class="btn primary" href="\\${p.data}" target="_blank">Open</a><a class="btn" href="\\${p.data}" download="\\${esc(p.file||'lesson-plan')}">Download</a>\`:'';return \`<div class="item"><b>\\${esc(p.file||'Lesson plan')}</b><small>\\${esc(p.grade||'Grade not specified')} · Week \\${esc(r.week)}</small><div class="actions">\\${fileBtns}<button class="btn gold" onclick="editPlan(\\${i},'\\${r.key}',\\${r.index})">Edit</button><button class="btn" onclick="replacePlan(\\${i},'\\${r.key}',\\${r.index})">Replace File</button><button class="btn danger" onclick="deletePlan(\\${i},'\\${r.key}',\\${r.index})">Delete</button></div></div>\`}).join('')}</div>\`}html+='<div class="actions"><button class="btn" onclick="closeModal()">Close</button></div>';openModal(html)}
function editPlan(i,k,j){let p=state.teachers[i].plans[k][j];openModal(\`<h2>Edit Lesson Plan</h2><label>Grade / class</label><input id="editGrade" value="\\${esc(p.grade||'')}"><div class="actions"><button class="btn primary" onclick="savePlanEdit(\\${i},'\\${k}',\\${j})">Save Changes</button><button class="btn" onclick="openFolder(\\${i})">Cancel</button></div>\`)}
function savePlanEdit(i,k,j){state.teachers[i].plans[k][j].grade=editGrade.value.trim();save();openFolder(i)}
function replacePlan(i,k,j){let p=state.teachers[i].plans[k][j];openModal(\`<h2>Replace Lesson Plan File</h2><p>\\${esc(p.file||'Current file')}</p><label>Choose replacement file</label><input id="replaceFile" type="file" accept=".pdf,.doc,.docx,.ppt,.pptx"><div class="actions"><button class="btn primary" onclick="savePlanReplacement(\\${i},'\\${k}',\\${j})">Replace File</button><button class="btn" onclick="openFolder(\\${i})">Cancel</button></div>\`)}
function savePlanReplacement(i,k,j){let file=replaceFile.files[0];if(!file)return alert('Choose a replacement file.');let p=state.teachers[i].plans[k][j],r=new FileReader();r.onload=()=>{p.file=file.name;p.data=r.result;p.date=new Date().toISOString();save();openFolder(i)};r.readAsDataURL(file)}
function deletePlan(i,k,j){if(!confirm('Delete this lesson plan?'))return;state.teachers[i].plans[k].splice(j,1);save();openFolder(i)}
function renderTeachers(){let k=weekKey(),out='';state.teachers.forEach((t,i)=>{let c=(t.plans[k]||[]).length,p=Math.min(100,c/4*100),cls=c>=4?'done':'low';out+=\`<div class="teacher \\${cls}" onclick="openFolder(\\${i})" title="Open \\${esc(t.name)} folder"><div class="row"><b>📁 \\${esc(t.name)}</b><strong>\\${Math.round(p)}%</strong></div><div class="progress"><div class="bar" style="width:\\${p}%"></div></div></div>\`});teacherGrid.innerHTML=out||'<p>No teacher folders yet.</p>';let stars=state.teachers.filter(t=>(t.plans[k]||[]).length>=4).map(t=>t.name);starTrack.textContent=stars.length?'⭐ Star Teachers of the Week: '+stars.join(' ⭐ '):'⭐ Star Teachers of the Week: Teachers who upload at least 4 lesson plans this week will appear here automatically.'}
(function(){let cards=[...document.querySelectorAll('.card')],card=cards.find(x=>x.querySelector('h3')&&x.querySelector('h3').textContent.includes('Lesson Plans'));if(card)card.classList.add('lesson-compact');renderTeachers()})();
`;d.body.appendChild(s);
});
</script></body></html>
