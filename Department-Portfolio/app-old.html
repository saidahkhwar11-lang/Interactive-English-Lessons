<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>English Department Digital Portfolio</title><style>html,body{margin:0;height:100%;overflow:hidden}iframe{border:0;width:100%;height:100vh;display:block}</style></head><body><iframe id="app" src="base.html"></iframe><script>
const patch=`
function openTeacherFolder(i){let t=state.teachers[i],rows=[];Object.entries(t.plans||{}).forEach(([k,arr])=>{if(k.startsWith(state.term+'-'))(arr||[]).forEach((x,idx)=>rows.push({...x,week:k.split('-W')[1]||'',planKey:k,planIndex:idx}))});rows.sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));openModal(\`<h2>📁 \${esc(t.name)} · \${esc(state.term)}</h2>\${rows.length?\`<div class="list">\${rows.map(x=>{let open=x.fileId?\`<button class="btn primary" onclick="openStoredFile('\\${x.fileId}')">Open</button><button class="btn" onclick="downloadStoredFile('\\${x.fileId}','\\${esc((x.file||'lesson-plan').replace(/'/g,"\\\\'"))}')">Download</button>\`:x.data?\`<a class="btn primary" href="\\${x.data}" target="_blank">Open</a><a class="btn" href="\\${x.data}" download="\\${esc(x.file||'lesson-plan')}">Download</a>\`:'<small>File copy is not available on this device.</small>';return \`<div class="item"><b>\\${esc(x.file||'Lesson plan')}</b><small>\\${esc(x.grade||'')} · Week \\${esc(x.week)}</small><div class="actions">\\${open}<button class="btn gold" onclick="editPlan(\\${i},'\\${x.planKey}',\\${x.planIndex})">Edit</button><button class="btn" onclick="replacePlan(\\${i},'\\${x.planKey}',\\${x.planIndex})">Replace File</button><button class="btn danger" onclick="deletePlan(\\${i},'\\${x.planKey}',\\${x.planIndex})">Delete</button></div></div>\`}).join('')}</div>\`:'<p>No lesson plans uploaded for this term yet.</p>'}<div class="actions"><button class="btn" onclick="closeModal()">Close</button></div>\`)}
function editPlan(i,k,j){let p=state.teachers[i].plans[k][j];openModal(\`<h2>Edit Lesson Plan</h2><label>Grade / class</label><input id="editGrade" value="\${esc(p.grade||'')}"><div class="actions"><button class="btn primary" onclick="savePlanEdit(\${i},'\${k}',\${j})">Save Changes</button><button class="btn" onclick="openTeacherFolder(\${i})">Cancel</button></div>\`)}
function savePlanEdit(i,k,j){state.teachers[i].plans[k][j].grade=editGrade.value.trim();save();openTeacherFolder(i)}
function replacePlan(i,k,j){let p=state.teachers[i].plans[k][j];openModal(\`<h2>Replace Lesson Plan File</h2><p>\${esc(p.file||'Current file')}</p><label>Choose replacement file</label><input id="replaceFile" type="file" accept=".pdf,.doc,.docx,.ppt,.pptx"><div class="actions"><button class="btn primary" onclick="savePlanReplacement(\${i},'\${k}',\${j})">Replace File</button><button class="btn" onclick="openTeacherFolder(\${i})">Cancel</button></div>\`)}
async function savePlanReplacement(i,k,j){let file=replaceFile.files[0];if(!file)return alert('Choose a replacement file.');let p=state.teachers[i].plans[k][j],oldId=p.fileId;if(typeof putFile==='function'){let id='plan-'+Date.now()+'-'+Math.random().toString(36).slice(2);await putFile(id,file);p.file=file.name;p.fileId=id;p.type=file.type;delete p.data;if(oldId&&typeof deleteStoredFile==='function')await deleteStoredFile(oldId)}else{let data=await new Promise(r=>{let f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(file)});p.file=file.name;p.data=data;delete p.fileId}p.date=new Date().toISOString();save();openTeacherFolder(i)}
async function deletePlan(i,k,j){let p=state.teachers[i].plans[k][j];if(!confirm('Delete this lesson plan?'))return;if(p.fileId&&typeof deleteStoredFile==='function')await deleteStoredFile(p.fileId);state.teachers[i].plans[k].splice(j,1);save();openTeacherFolder(i)}
function viewShare(cat){let arr=state.shares.map((x,i)=>({...x,shareIndex:i})).filter(x=>x.term===state.term&&x.cat===cat);openModal(\`<h2>\${esc(cat)} · \${esc(state.term)}</h2>\${arr.length?\`<div class="list">\${arr.map(x=>{let open=x.fileId?\`<button class="btn primary" onclick="openStoredFile('\\${x.fileId}')">Open</button><button class="btn" onclick="downloadStoredFile('\\${x.fileId}','\\${esc((x.file||'evidence').replace(/'/g,"\\\\'"))}')">Download</button>\`:x.data?\`<a class="btn primary" href="\\${x.data}" target="_blank">Open</a><a class="btn" href="\\${x.data}" download="\\${esc(x.file||'evidence')}">Download</a>\`:'';return \`<div class="item"><b>\\${esc(x.title)}</b><small>\\${esc(x.teacher)} · \\${esc(x.grade||'')}\\${x.file?' · '+esc(x.file):''}</small><p>\\${esc(x.desc||'')}</p><div class="actions">\\${open}<button class="btn gold" onclick="editShare(\\${x.shareIndex})">Edit</button><button class="btn" onclick="replaceShareFile(\\${x.shareIndex})">Replace File</button><button class="btn danger" onclick="deleteShare(\\${x.shareIndex})">Delete</button></div></div>\`}).join('')}</div>\`:'<p>No evidence added yet.</p>'}<div class="actions"><button class="btn" onclick="closeModal()">Close</button></div>\`)}
function editShare(i){let x=state.shares[i];openModal(\`<h2>Edit \${esc(x.cat)}</h2><label>Title</label><input id="editSTitle" value="\${esc(x.title)}"><label>Teacher name</label><input id="editSTeacher" value="\${esc(x.teacher)}"><label>Grade / class</label><input id="editSGrade" value="\${esc(x.grade||'')}"><label>Short description</label><textarea id="editSDesc">\${esc(x.desc||'')}</textarea><div class="actions"><button class="btn primary" onclick="saveShareEdit(\${i})">Save Changes</button><button class="btn" onclick="viewShare('\${esc(x.cat)}')">Cancel</button></div>\`)}
function saveShareEdit(i){let x=state.shares[i];x.title=editSTitle.value.trim();x.teacher=editSTeacher.value.trim();x.grade=editSGrade.value.trim();x.desc=editSDesc.value.trim();if(!x.title||!x.teacher)return alert('Add title and teacher name.');save();viewShare(x.cat)}
function replaceShareFile(i){let x=state.shares[i];openModal(\`<h2>Replace Evidence File</h2><p>\${esc(x.file||'No current file')}</p><label>Choose replacement file</label><input id="replaceShareInput" type="file"><div class="actions"><button class="btn primary" onclick="saveShareReplacement(\${i})">Replace File</button><button class="btn" onclick="viewShare('\${esc(x.cat)}')">Cancel</button></div>\`)}
async function saveShareReplacement(i){let file=replaceShareInput.files[0];if(!file)return alert('Choose a replacement file.');let x=state.shares[i],oldId=x.fileId;if(typeof putFile==='function'){let id='share-'+Date.now()+'-'+Math.random().toString(36).slice(2);await putFile(id,file);x.file=file.name;x.fileId=id;x.type=file.type;delete x.data;if(oldId&&typeof deleteStoredFile==='function')await deleteStoredFile(oldId)}else{let data=await new Promise(r=>{let f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(file)});x.file=file.name;x.data=data;delete x.fileId}x.date=new Date().toISOString();save();viewShare(x.cat)}
async function deleteShare(i){let x=state.shares[i];if(!confirm('Delete this evidence item?'))return;let cat=x.cat;if(x.fileId&&typeof deleteStoredFile==='function')await deleteStoredFile(x.fileId);state.shares.splice(i,1);save();viewShare(cat)}
if(typeof renderShares==='function')renderShares();
`;
app.addEventListener('load',()=>{const d=app.contentDocument,s=d.createElement('script');s.textContent=patch;d.body.appendChild(s)});
</script></body></html>
